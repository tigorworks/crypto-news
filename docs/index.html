                      </li>
                    </template>
                  </ul>
                </div>
              </template>
            </div>
          </template>

          <template x-if="bagianAiTampil('narasi') && adaBagianTerstruktur">
            <div class="mt-3 space-y-4 text-[15px] leading-relaxed text-slate-800 dark:text-slate-100">
              <template x-for="b in bagianAnalis" :key="b.kunci">
                <div>
                  <h4 class="text-xs font-semibold uppercase tracking-wide text-indigo-900/60 dark:text-indigo-200/60 mb-1"
                      x-text="b.label"></h4>
                  <template x-if="b.tipe === 'teks'">
                    <div class="space-y-2">
                      <template x-for="(par, i) in b.nilai.split(/\n{2,}/)" :key="i">
                        <p x-text="par"></p>
                      </template>
                    </div>
                  </template>
                  <template x-if="b.tipe === 'daftar'">
                    <ul class="space-y-1">
                      <template x-for="(item, i) in b.nilai" :key="i">
                        <li class="flex gap-2"><span class="text-slate-300 dark:text-slate-600">•</span><span x-text="item"></span></li>
                      </template>
                    </ul>
                  </template>
                </div>
              </template>
            </div>
          </template>

          <template x-if="bagianAiTampil('narasi') && !adaBagianTerstruktur && data.ai.narrative">
            <div class="mt-4 space-y-3 text-[15px] leading-relaxed text-slate-800 dark:text-slate-100">
              <template x-for="(p, i) in paragrafNarasi" :key="i">
                <p x-text="p"></p>
              </template>
            </div>
          </template>

          <!-- Penyebab pergerakan -->
          <template x-if="bagianAiTampil('narasi') && data.ai.penyebab_pergerakan?.length">
            <div class="mt-5 pt-4 border-t border-indigo-200 dark:border-indigo-700/50">
              <h3 class="text-xs font-semibold uppercase tracking-wide text-indigo-900/60 dark:text-indigo-200/60 mb-2">
                Penyebab pergerakan
              </h3>
              <ul class="space-y-2">
                <template x-for="(p, i) in data.ai.penyebab_pergerakan" :key="i">
                  <li class="flex gap-2.5 text-sm">
                    <span class="font-bold shrink-0 mt-0.5" :class="warnaArah(p.arah)" x-text="panahArah(p.arah)"></span>
                    <div>
                      <div class="font-medium">
                        <span x-text="p.faktor"></span>
                        <span class="ml-1 text-[11px] sm:text-[10px] px-1.5 py-0.5 rounded align-middle"
                              :class="kelasKeyakinan(p.keyakinan)"
                              x-text="'keyakinan ' + p.keyakinan"></span>
                      </div>
                      <div class="text-slate-600 dark:text-slate-400 text-sm sm:text-[13px]" x-text="p.dasar"></div>
                    </div>
                  </li>
                </template>
              </ul>
            </div>
          </template>

          <!-- Outlook ke depan — makro, geopolitik, dan agenda ditempatkan
               di sini, TEPAT SETELAH penyebab pergerakan, bukan di paling
               bawah: faktor-faktor ini sedang sangat menentukan arah pasar
               belakangan ini, jadi tidak pantas terkubur di bawah pembacaan
               teknikal dan whale yang levelnya lebih taktis. -->
          <template x-if="bagianAiTampil('outlook') && data.ai.outlook">
            <div class="mt-5 pt-4 border-t border-indigo-200 dark:border-indigo-700/50">
              <h3 class="text-xs font-semibold uppercase tracking-wide text-indigo-900/60 dark:text-indigo-200/60 mb-2 flex items-center gap-2">
                Pandangan ke depan
                <template x-if="data.ai.outlook.horizon">
                  <span class="text-[11px] sm:text-[11px] sm:text-[10px] px-1.5 py-0.5 rounded bg-indigo-100 dark:bg-indigo-900/50 normal-case tracking-normal"
                        x-text="data.ai.outlook.horizon"></span>
                </template>
              </h3>
              <p class="text-sm leading-relaxed" x-text="data.ai.outlook.ringkasan"></p>

              <!-- ===== PETA JANGKAUAN HARGA — angkanya dari kode =====
                   Pandangan ke depan tadinya murni prosa, padahal angkanya
                   sudah ada: level kunci, level invalidasi, dan kisaran harian
                   normal (ATR). Meter ini menaruh semuanya di satu sumbu.

                   Bentuknya METER, bukan grafik: satu nilai terhadap dua
                   batas. Pewarnaannya EMPHASIS — satu aksen indigo untuk harga
                   sekarang, sisanya abu-abu redup. Batas atas dan bawah
                   dibedakan lewat POSISI + LABEL, bukan warna; merah/hijau di
                   sini gagal uji keterbacaan buta warna padahal keduanya
                   bersebelahan di satu batang. -->
              <template x-if="petaJangkauan">
                <div class="mt-4 p-3 sm:p-4 rounded-lg bg-white/60 dark:bg-slate-800/40">
                  <div class="text-[11px] font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400">
                    Peta jangkauan harga
                  </div>

                  <!-- Meter.

                       Geometrinya ditulis sebagai INLINE STYLE, bukan utility
                       class. Posisi penanda di sini harus tepat, dan utility
                       yang kebetulan tidak ikut ter-generate akan membuat
                       label menumpuk di atas batangnya tanpa error apa pun —
                       kegagalan diam yang cuma ketahuan kalau ada yang
                       melihat halamannya. Inline style tidak bisa gagal
                       begitu, dan membuat pratinjau lokal setia pada hasil
                       sebenarnya. -->
                  <div class="relative"
                       style="height:10px;border-radius:9999px;margin-top:30px;margin-bottom:30px;background:var(--meter-track)">
                    <!-- Pita kisaran harian normal (ATR): satu hue lebih terang
                         dari aksen, jadi ia terbaca sebagai konteks, bukan seri
                         kedua. -->
                    <template x-if="petaJangkauan.pita">
                      <div class="absolute"
                           :style="`top:0;bottom:0;border-radius:9999px;background:var(--meter-band);left:${petaJangkauan.pita.kiri}%;width:${petaJangkauan.pita.kanan - petaJangkauan.pita.kiri}%`"></div>
                    </template>

                    <!-- Support & resistance: penanda netral + huruf penanda.
                         Identitasnya dibawa POSISI dan LABEL, bukan warna. -->
                    <template x-if="petaJangkauan.posisiSupport !== null">
                      <div class="absolute" title="Support terdekat"
                           :style="`top:-5px;bottom:-5px;width:2px;background:var(--meter-tick);left:${petaJangkauan.posisiSupport}%`"></div>
                    </template>
                    <template x-if="petaJangkauan.posisiResisten !== null">
                      <div class="absolute" title="Resistance terdekat"
                           :style="`top:-5px;bottom:-5px;width:2px;background:var(--meter-tick);left:${petaJangkauan.posisiResisten}%`"></div>
                    </template>
                    <template x-if="petaJangkauan.posisiSupport !== null">
                      <div class="absolute font-semibold text-slate-500 dark:text-slate-400"
                           :style="`top:17px;font-size:10px;line-height:1;left:${petaJangkauan.posisiSupport}%;transform:translateX(-50%)`">S</div>
                    </template>
                    <template x-if="petaJangkauan.posisiResisten !== null">
                      <div class="absolute font-semibold text-slate-500 dark:text-slate-400"
                           :style="`top:17px;font-size:10px;line-height:1;left:${petaJangkauan.posisiResisten}%;transform:translateX(-50%)`">R</div>
                    </template>

                    <!-- Harga sekarang: satu-satunya aksen. Cincin 2px sewarna
                         permukaan memisahkannya dari pita di bawahnya. -->
                    <div class="absolute"
                         :style="`top:-6px;bottom:-6px;width:4px;border-radius:9999px;background:var(--meter-accent);box-shadow:0 0 0 2px var(--meter-ring);left:calc(${petaJangkauan.posisiHarga}% - 2px)`"></div>
                    <div class="absolute font-bold"
                         :style="`top:-24px;color:var(--meter-accent);font-size:11px;line-height:1;white-space:nowrap;left:${petaJangkauan.posisiHarga}%;transform:translateX(-50%)`"
                         x-text="uang(petaJangkauan.harga)"></div>
                  </div>

                  <!-- Label ujung: batas pembatalan skenario, dari key_levels. -->
                  <div class="flex justify-between text-slate-500 dark:text-slate-400" style="font-size:11px">
                    <span x-text="petaJangkauan.invalidasiNaik ? 'batal naik ' + uang(petaJangkauan.invalidasiNaik) : ''"></span>
                    <span x-text="petaJangkauan.invalidasiTurun ? 'batal turun ' + uang(petaJangkauan.invalidasiTurun) : ''"></span>
                  </div>

                  <!-- Baris angka: jarak ke tiap batas, dan seberapa besar satu
                       hari normal dibanding jarak itu. -->
                  <div class="mt-3 grid grid-cols-3 gap-2 sm:gap-3 text-center">
                    <div>
                      <div class="text-[11px] text-slate-500 dark:text-slate-400">Ke support</div>
                      <div class="text-sm sm:text-base font-semibold" :class="warnaAngka(petaJangkauan.jarakSupportPct)"
                           x-text="petaJangkauan.jarakSupportPct === null ? '—' : persen(petaJangkauan.jarakSupportPct, 2)"></div>
                      <div class="text-[11px] text-slate-400" x-text="petaJangkauan.support ? uang(petaJangkauan.support) : ''"></div>
                    </div>
                    <div>
                      <div class="text-[11px] text-slate-500 dark:text-slate-400">Ke resistance</div>
                      <div class="text-sm sm:text-base font-semibold" :class="warnaAngka(petaJangkauan.jarakResistenPct)"
                           x-text="petaJangkauan.jarakResistenPct === null ? '—' : persen(petaJangkauan.jarakResistenPct, 2)"></div>
                      <div class="text-[11px] text-slate-400" x-text="petaJangkauan.resisten ? uang(petaJangkauan.resisten) : ''"></div>
                    </div>
                    <div>
                      <div class="text-[11px] text-slate-500 dark:text-slate-400" title="Average True Range: rata-rata rentang gerak satu hari">Kisaran harian</div>
                      <div class="text-sm sm:text-base font-semibold text-slate-700 dark:text-slate-200"
                           x-text="petaJangkauan.atrPct === null ? '—' : '±' + angka(petaJangkauan.atrPct, 2) + '%'"></div>
                      <div class="text-[11px] text-slate-400" x-text="petaJangkauan.atr ? '±' + uang(petaJangkauan.atr) : ''"></div>
                    </div>
                  </div>

                  <p class="mt-2 text-[11px] leading-relaxed text-slate-500 dark:text-slate-400">
                    Pita terang menandai jangkauan satu hari yang normal (ATR). Kalau pita itu
                    sudah menyentuh sebuah level, level tersebut berada dalam jangkauan wajar
                    satu hari perdagangan — bukan ramalan, hanya ukuran jarak.
                  </p>
                </div>
              </template>

              <!-- Skenario bisa ditahan sendiri tanpa membuang prosa dan
                   geopolitik di atasnya; kalau kosong, gridnya tidak dirender
                   supaya tidak menyisakan ruang kosong. -->
              <template x-if="skenarioOutlook.length">
                <div class="mt-3 grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <template x-for="sk in skenarioOutlook" :key="sk.nama">
                    <div class="p-3 rounded-lg bg-white/60 dark:bg-slate-800/40">
                      <div class="text-sm sm:text-[13px] font-semibold flex items-center gap-1.5" :class="sk.warna">
                        <span x-text="sk.panah"></span><span x-text="sk.nama"></span>
                      </div>
                      <ul class="mt-1.5 space-y-1 text-sm sm:text-[13px]">
                        <template x-for="(p, i) in sk.data.pemicu" :key="i">
                          <li class="flex gap-1.5"><span class="text-slate-300 dark:text-slate-600">•</span><span x-text="p"></span></li>
                        </template>
                      </ul>
                      <template x-if="sk.data.kondisi">
                        <p class="mt-2 text-[12px] text-slate-500 dark:text-slate-400" x-text="'Syarat: ' + sk.data.kondisi"></p>
                      </template>
                    </div>
                  </template>
                </div>
              </template>
            </div>
          </template>

          <!-- Pembacaan teknikal oleh AI -->
          <template x-if="bagianAiTampil('teknikal') && data.ai.teknikal">
            <div class="mt-5 pt-4 border-t border-indigo-200 dark:border-indigo-700/50">
              <h3 class="text-xs font-semibold uppercase tracking-wide text-indigo-900/60 dark:text-indigo-200/60 mb-2 flex items-center gap-2">
                Pembacaan teknikal
                <template x-if="data.ai.teknikal.kualitas_tren">
                  <span class="text-[11px] sm:text-[11px] sm:text-[10px] px-1.5 py-0.5 rounded bg-indigo-100 dark:bg-indigo-900/50 normal-case tracking-normal"
                        x-text="'tren: ' + data.ai.teknikal.kualitas_tren.replace('_',' ')"></span>
                </template>
              </h3>
              <p class="text-sm leading-relaxed" x-text="data.ai.teknikal.ringkasan"></p>

              <div class="mt-3 grid grid-cols-1 sm:grid-cols-2 gap-3">
                <template x-if="data.ai.teknikal.struktur">
                  <div class="p-3 rounded-lg bg-white/60 dark:bg-slate-800/40">
                    <div class="text-xs sm:text-[11px] font-bold text-indigo-700 dark:text-indigo-300 mb-1">STRUKTUR &amp; TREN</div>
                    <p class="text-sm sm:text-[13px] leading-relaxed text-slate-700 dark:text-slate-300"
                       x-text="data.ai.teknikal.struktur"></p>
                  </div>
                </template>
                <template x-if="data.ai.teknikal.momentum_volume">
                  <div class="p-3 rounded-lg bg-white/60 dark:bg-slate-800/40">
                    <div class="text-xs sm:text-[11px] font-bold text-indigo-700 dark:text-indigo-300 mb-1">MOMENTUM &amp; VOLUME</div>
                    <p class="text-sm sm:text-[13px] leading-relaxed text-slate-700 dark:text-slate-300"
                       x-text="data.ai.teknikal.momentum_volume"></p>
                  </div>
                </template>
              </div>

              <div class="mt-3 grid grid-cols-1 sm:grid-cols-2 gap-3 text-sm sm:text-[13px]">
                <template x-if="data.ai.teknikal.konfluensi?.length">
                  <div>
                    <div class="text-slate-500 dark:text-slate-400 mb-1">Saling menguatkan</div>
                    <ul class="space-y-1">
                      <template x-for="(k, i) in data.ai.teknikal.konfluensi" :key="i">
                        <li class="flex gap-1.5"><span class="text-emerald-500">+</span><span x-text="k"></span></li>
                      </template>
                    </ul>
                  </div>
                </template>
                <template x-if="data.ai.teknikal.kontradiksi?.length">
                  <div>
                    <div class="text-slate-500 dark:text-slate-400 mb-1">Saling bertentangan</div>
                    <ul class="space-y-1">
                      <template x-for="(k, i) in data.ai.teknikal.kontradiksi" :key="i">
                        <li class="flex gap-1.5"><span class="text-amber-500">!</span><span x-text="k"></span></li>
                      </template>
                    </ul>
                  </div>
                </template>
              </div>

              <template x-if="data.ai.teknikal.pembatalan">
                <p class="mt-3 text-sm sm:text-[13px] text-slate-600 dark:text-slate-400">
                  <span class="font-medium">Pembacaan ini batal bila: </span>
                  <span x-text="data.ai.teknikal.pembatalan"></span>
                </p>
              </template>
            </div>
          </template>

          <!-- Analisa whale & sinyal palsu -->
          <template x-if="bagianAiTampil('whale') && data.ai.whale">
            <div class="mt-5 pt-4 border-t border-indigo-200 dark:border-indigo-700/50">
              <h3 class="text-xs font-semibold uppercase tracking-wide text-indigo-900/60 dark:text-indigo-200/60 mb-2 flex items-center gap-2">
                Pemain besar &amp; sinyal palsu
                <span class="text-[11px] sm:text-[11px] sm:text-[10px] px-1.5 py-0.5 rounded normal-case tracking-normal"
                      :class="kelasWaspada(data.ai.whale.tingkat_kewaspadaan)"
                      x-text="'kewaspadaan ' + data.ai.whale.tingkat_kewaspadaan"></span>
              </h3>
              <p class="text-sm leading-relaxed" x-text="data.ai.whale.ringkasan"></p>

              <template x-if="data.ai.whale.posisi_whale_vs_ritel">
                <p class="mt-2 text-sm sm:text-[13px] text-slate-600 dark:text-slate-400" x-text="data.ai.whale.posisi_whale_vs_ritel"></p>
              </template>

              <template x-if="data.ai.whale.sinyal_palsu?.length">
                <ul class="mt-3 space-y-2">
                  <template x-for="(s, i) in data.ai.whale.sinyal_palsu" :key="i">
                    <li class="p-2.5 rounded-lg bg-white/60 dark:bg-slate-800/40 text-sm sm:text-[13px]">
                      <div class="font-medium flex items-center gap-2 flex-wrap">
                        <span x-text="s.pola"></span>
                        <span class="text-[11px] sm:text-[11px] sm:text-[10px] px-1.5 py-0.5 rounded" :class="kelasKeyakinan(s.keyakinan)"
                              x-text="'keyakinan ' + s.keyakinan"></span>
                      </div>
                      <div class="text-slate-600 dark:text-slate-400 mt-0.5" x-text="s.arti"></div>
                    </li>
                  </template>
                </ul>
              </template>

              <template x-if="data.ai.whale.catatan">
                <p class="mt-3 text-sm sm:text-[13px] text-slate-600 dark:text-slate-400" x-text="data.ai.whale.catatan"></p>
              </template>
            </div>
          </template>

          <template x-if="!adaKontenAiTampil">
            <p class="mt-4 text-sm text-slate-600 dark:text-slate-300">
              Analisa AI tidak tersedia pada run ini.
            </p>
          </template>

          <!-- Tema & pergeseran narasi (juga hasil AI) -->
          <template x-if="data.aggregate.dominant_themes?.length || data.aggregate.narrative_shift">
            <div class="mt-4 pt-4 border-t border-indigo-200 dark:border-indigo-700/50 space-y-2">
              <template x-if="data.aggregate.dominant_themes?.length">
                <div class="flex items-center gap-2 flex-wrap text-sm">
                  <span class="text-indigo-900/60 dark:text-indigo-200/60">Tema dominan:</span>
                  <template x-for="t in data.aggregate.dominant_themes" :key="t">
                    <span class="px-2 py-0.5 rounded-md bg-indigo-100 dark:bg-indigo-900/50 text-indigo-800 dark:text-indigo-200 text-xs" x-text="t"></span>
                  </template>
                </div>
              </template>
              <template x-if="data.aggregate.narrative_shift">
                <p class="text-sm text-slate-700 dark:text-slate-300">
                  <span class="text-indigo-900/60 dark:text-indigo-200/60">Pergeseran fokus: </span>
                  <span x-text="data.aggregate.narrative_shift"></span>
                </p>
              </template>
            </div>
          </template>
          <!-- Kalimat bernada anjuran: DITANDAI, bukan ditahan. Keputusannya
               tetap di tangan pembaca, jadi analisanya tidak dibuang.

               Ditaruh di DASAR bagian ini dengan font kecil: isinya catatan
               kaki editorial, bukan temuan pasar. Di posisi lamanya (tepat di
               bawah judul) ia justru menyela sebelum pembaca sempat membaca
               satu kalimat pun analisa. -->
          <template x-if="tandaEditorial.length">
            <details class="mt-5 pt-4 border-t border-indigo-200 dark:border-indigo-700/50">
              <summary class="tap cursor-pointer text-xs flex items-center gap-1.5 text-slate-500 dark:text-slate-400">
                <i data-lucide="info" class="w-3.5 h-3.5 shrink-0"></i>
                <span x-text="'Sebagian kalimat menyerempet anjuran tindakan (' + tandaEditorial.length + ')'"></span>
              </summary>
              <p class="mt-2 text-[11px] leading-relaxed text-slate-500 dark:text-slate-400">
                Ini analisa, bukan instruksi bertransaksi. Kalimatnya tetap ditampilkan supaya konteksnya utuh —
                yang benar-benar ditahan hanyalah angka yang tidak ada di data.
              </p>
              <ul class="mt-2 space-y-1.5 text-[11px] leading-relaxed text-slate-500 dark:text-slate-400">
                <template x-for="(t, i) in tandaEditorial" :key="i">
                  <li class="pl-3 border-l-2 border-slate-200 dark:border-slate-700">
                    <span class="italic" x-text="'“' + t.kutipan + '”'"></span>
                  </li>
                </template>
              </ul>
            </details>
          </template>

        </section>
        <!-- ================= KALENDER 30 HARI ================= -->
        <section id="s-agenda" class="bg-white dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl p-4 sm:p-5">

          <div class="bg-white dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl p-4 sm:p-5">
            <div class="flex items-center justify-between gap-3 flex-wrap mb-3">
              <h2 class="font-semibold flex items-center gap-2">
                <i data-lucide="calendar" class="w-4 h-4 text-slate-400"></i> Agenda 30 Hari
                <span class="text-sm font-normal text-slate-400" x-text="'(' + agendaTersaring.length + ')'"></span>
              </h2>
              <select x-model="filterDampakAgenda"
                      class="text-sm px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700">
                <option value="besar">Dampak besar</option>
                <option value="">Semua agenda</option>
              </select>
            </div>
            <template x-if="!agendaTersaring.length && (data?.calendar || []).length">
              <p class="text-sm text-slate-500">Tidak ada agenda berdampak besar dalam 30 hari ke depan — coba filter "Semua agenda".</p>
            </template>
            <template x-if="!(data?.calendar || []).length">
              <p class="text-sm text-slate-500">Tidak ada agenda dalam 30 hari ke depan.</p>
            </template>
            <ul class="space-y-2.5">
              <template x-for="(a, i) in agendaTampil" :key="a.waktu_utc + a.nama">
                <li class="flex items-start justify-between gap-3 text-sm">
                  <div>
                    <div class="font-medium">
                      <span x-text="a.nama"></span>
                      <template x-if="a.perkiraan">
                        <span class="text-[11px] sm:text-[11px] sm:text-[10px] text-slate-400 ml-1" title="Tanggal perkiraan dari pola rilis bulanan">perkiraan</span>
                      </template>
                    </div>
                    <div class="text-xs text-slate-500 dark:text-slate-400"
                         x-text="[a.hari, a.waktu_wib].filter(Boolean).join(', ')"></div>

                    <!-- Penilaian dampak ke kripto: hasil AI, jadi diberi
                         ring indigo seperti chip AI lain di halaman ini. -->
                    <template x-if="a.jalur">
                      <div class="mt-1.5">
                        <div class="flex items-center gap-1.5 flex-wrap">
                          <span class="inline-flex items-center gap-1 text-[10px] font-bold px-1.5 py-0.5 rounded bg-indigo-600 text-white shrink-0">
                            <i data-lucide="sparkles" class="w-2.5 h-2.5"></i> AI
                          </span>
                          <template x-if="a.relevansi_kripto">
                            <span class="text-[11px] px-1.5 py-0.5 rounded-full ring-1 ring-indigo-300 dark:ring-indigo-600/70"
                                  :class="kelasRelevansiAgenda(a.relevansi_kripto)"
                                  x-text="labelRelevansiAgenda(a.relevansi_kripto)"></span>
                          </template>
                          <template x-if="a.arah">
                            <span class="text-[11px] px-1.5 py-0.5 rounded-full ring-1 ring-indigo-300 dark:ring-indigo-600/70 bg-slate-100 dark:bg-slate-700"
                                  x-text="labelArahAgenda(a.arah)"></span>
                          </template>
                        </div>
                        <p class="mt-1 text-xs text-slate-600 dark:text-slate-300 leading-relaxed" x-text="a.jalur"></p>
                      </div>
                    </template>
                  </div>
                  <span class="text-xs px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-700 whitespace-nowrap shrink-0"
                        x-text="hitungMundur(a.jam_lagi)"></span>
                </li>
              </template>
            </ul>

            <template x-if="totalHalamanAgenda > 1">
              <div class="mt-4 flex items-center justify-between gap-3 pt-3 border-t border-slate-200 dark:border-slate-700">
                <button @click="gantiHalamanAgenda(-1, $event)" :disabled="halamanAgenda === 1"
                        class="px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600 text-sm font-medium inline-flex items-center gap-1.5 disabled:opacity-40 disabled:cursor-not-allowed hover:bg-slate-50 dark:hover:bg-slate-700 transition">
                  <i data-lucide="chevron-left" class="w-4 h-4"></i>
                  <span class="hidden sm:inline">Sebelumnya</span>
                </button>
                <span class="text-sm text-slate-500 dark:text-slate-400 text-center"
                      x-text="'Halaman ' + halamanAgenda + ' dari ' + totalHalamanAgenda"></span>
                <button @click="gantiHalamanAgenda(1, $event)" :disabled="halamanAgenda === totalHalamanAgenda"
                        class="px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600 text-sm font-medium inline-flex items-center gap-1.5 disabled:opacity-40 disabled:cursor-not-allowed hover:bg-slate-50 dark:hover:bg-slate-700 transition">
                  <span class="hidden sm:inline">Berikutnya</span>
                  <i data-lucide="chevron-right" class="w-4 h-4"></i>
                </button>
              </div>
            </template>
          </div>

        </section>
        <!-- ============ BERITA & PERNYATAAN (satu bagian, dua tab) ============ -->
        <!-- Digabung karena keduanya menjawab pertanyaan yang sama: "apa yang
             dikatakan dunia luar hari ini". Dipisah tab supaya daftarnya tidak
             berbaris panjang dan bagian di bawahnya tetap terjangkau. -->
        <section id="s-berita" class="bg-white dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl p-4 sm:p-5">
          <div class="flex items-center justify-between gap-3 flex-wrap">
            <div class="flex gap-1 p-1 rounded-lg bg-slate-100 dark:bg-slate-700/50">
              <button @click="gantiTab('berita')"
                      class="tab-isi px-3 py-1.5 text-sm font-medium rounded-md transition inline-flex items-center gap-1.5"
                      :class="tabKonten === 'berita' ? 'bg-white dark:bg-slate-800 shadow-sm' : 'text-slate-500 hover:text-slate-800 dark:hover:text-slate-200'">
                <i data-lucide="newspaper" class="w-4 h-4"></i>
                <span>Berita</span>
                <span class="text-slate-400 font-normal" x-text="'(' + beritaTersaring.length + ')'"></span>
              </button>
              <template x-if="adaPernyataan">
                <button @click="gantiTab('pernyataan')"
                        class="tab-isi px-3 py-1.5 text-sm font-medium rounded-md transition inline-flex items-center gap-1.5"
                        :class="tabKonten === 'pernyataan' ? 'bg-white dark:bg-slate-800 shadow-sm' : 'text-slate-500 hover:text-slate-800 dark:hover:text-slate-200'">
                  <i data-lucide="megaphone" class="w-4 h-4"></i>
                  <span>Pernyataan</span>
                  <span class="text-slate-400 font-normal" x-text="'(' + pernyataanTersaring.length + ')'"></span>
                </button>
              </template>
            </div>
            <div class="flex gap-2 flex-wrap" x-show="tabKonten === 'berita'">
              <select x-model="filterKategori"
                      class="text-sm px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700">
                <option value="">Semua kategori</option>
                <template x-for="k in kategoriTersedia" :key="k">
                  <option :value="k" x-text="k"></option>
                </template>
              </select>
              <select x-model="filterSentimen"
                      class="text-sm px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700">
                <option value="">Semua sentimen</option>
                <option value="bullish">bullish</option>
                <option value="bearish">bearish</option>
                <option value="netral">netral</option>
              </select>
            </div>
          </div>

          <!-- ---------------- TAB: BERITA ---------------- -->
          <div x-show="tabKonten === 'berita'">
          <!-- Penanda: chip sentimen/kekuatan/mekanisme berasal dari AI -->
          <p class="mt-3 text-xs text-slate-500 dark:text-slate-400 flex items-start gap-1.5">
            <span class="inline-flex items-center gap-1 text-[11px] sm:text-[10px] font-bold px-1.5 py-0.5 rounded bg-indigo-600 text-white shrink-0">
              <i data-lucide="sparkles" class="w-2.5 h-2.5"></i> AI
            </span>
            <span>Sumber dan waktu berasal dari penerbit berita. Judul diterjemahkan ke bahasa Indonesia,
              dan label sentimen, kekuatan, kategori, serta mekanisme dihasilkan AI.</span>
          </p>

          <template x-if="!beritaTersaring.length">
            <p class="mt-4 text-sm text-slate-500">Tidak ada berita yang cocok dengan filter ini.</p>
          </template>

          <ul class="mt-4 space-y-3">
            <template x-for="n in beritaTampil" :key="n.id">
              <li class="p-4 rounded-lg border border-slate-200 dark:border-slate-700 hover:border-slate-300 dark:hover:border-slate-600 transition">
                <div class="flex items-start justify-between gap-3">
                  <a :href="n.url" target="_blank" rel="noopener noreferrer"
                     class="font-medium hover:underline leading-snug py-0.5" x-text="n.judul_id || n.judul"></a>
                  <span class="text-xs text-slate-400 whitespace-nowrap shrink-0" x-text="waktuSingkat(n.waktu_utc)"></span>
                </div>

                <!-- Judul asli tetap ditampilkan: artikel yang dibuka berbahasa
                     Inggris, jadi pembaca perlu bisa mencocokkannya. -->
                <template x-if="n.judul_id && n.judul && n.judul_id !== n.judul">
                  <p class="mt-1 text-xs text-slate-400 dark:text-slate-500 italic leading-snug" x-text="n.judul"></p>
                </template>

                <template x-if="n.ringkasan_id">
                  <p class="mt-2 text-sm text-slate-600 dark:text-slate-300" x-text="n.ringkasan_id"></p>
                </template>

                <div class="mt-1.5 text-xs text-slate-500 dark:text-slate-400 flex items-center gap-2 flex-wrap">
                  <span x-text="n.sumber"></span>
                  <template x-if="n.jumlah_konfirmasi > 1">
                    <span x-text="'· ' + n.jumlah_konfirmasi + ' outlet'"></span>
                  </template>
                  <template x-if="n.reaksi_harga_1j !== null && n.reaksi_harga_1j !== undefined">
                    <span :class="warnaAngka(n.reaksi_harga_1j)" x-text="'· reaksi 1j ' + persen(n.reaksi_harga_1j, 2)"></span>
                  </template>
                </div>

                <!-- Chip hasil AI, diberi ring indigo supaya beda dari data mentah -->
                <div class="mt-2.5 flex flex-wrap gap-1.5 items-center">
                  <template x-if="n.sentimen">
                    <span class="text-xs sm:text-[11px] px-2 py-0.5 rounded-full ring-1 ring-indigo-300 dark:ring-indigo-600/70"
                          :class="kelasSentimen(n.sentimen)" x-text="n.sentimen"></span>
                  </template>
                  <template x-if="n.kekuatan">
                    <span class="text-xs sm:text-[11px] px-2 py-0.5 rounded-full ring-1 ring-indigo-300 dark:ring-indigo-600/70 bg-slate-100 dark:bg-slate-700"
                          x-text="labelDampak(n.kekuatan)"></span>
                  </template>
                  <template x-if="n.kategori">
                    <span class="text-xs sm:text-[11px] px-2 py-0.5 rounded-full ring-1 ring-indigo-300 dark:ring-indigo-600/70 bg-slate-100 dark:bg-slate-700"
                          x-text="n.kategori"></span>
                  </template>
                  <template x-if="n.status_kepastian">
                    <span class="text-xs sm:text-[11px] px-2 py-0.5 rounded-full ring-1 ring-indigo-300 dark:ring-indigo-600/70 bg-slate-100 dark:bg-slate-700"
                          x-text="n.status_kepastian.replace('_', ' ')"></span>
                  </template>
                  <template x-if="n.sudah_priced_in">
                    <span class="text-xs sm:text-[11px] px-2 py-0.5 rounded-full ring-1 ring-indigo-300 dark:ring-indigo-600/70 bg-slate-100 dark:bg-slate-700"
                          x-text="'priced in: ' + n.sudah_priced_in"></span>
                  </template>
                </div>

                <template x-if="n.mekanisme">
                  <div class="mt-2.5 pl-3 border-l-2 border-indigo-300 dark:border-indigo-600/70">
                    <div class="flex items-center gap-1 text-[11px] sm:text-[10px] font-bold text-indigo-700 dark:text-indigo-300 mb-0.5">
                      <i data-lucide="sparkles" class="w-2.5 h-2.5"></i> AI · MEKANISME
                    </div>
                    <p class="text-sm text-slate-600 dark:text-slate-300" x-text="n.mekanisme"></p>
                  </div>
                </template>
              </li>
            </template>
          </ul>

          <template x-if="totalHalamanBerita > 1">
            <div class="mt-4 flex items-center justify-between gap-3 pt-3 border-t border-slate-200 dark:border-slate-700">
              <button @click="gantiHalamanBerita(-1, $event)" :disabled="halamanBerita === 1"
                      class="px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600 text-sm font-medium inline-flex items-center gap-1.5 disabled:opacity-40 disabled:cursor-not-allowed hover:bg-slate-50 dark:hover:bg-slate-700 transition">
                <i data-lucide="chevron-left" class="w-4 h-4"></i>
                <span class="hidden sm:inline">Sebelumnya</span>
              </button>
              <span class="text-sm text-slate-500 dark:text-slate-400 text-center"
                    x-text="'Halaman ' + halamanBerita + ' dari ' + totalHalamanBerita + ' · ' + beritaTersaring.length + ' berita'"></span>
              <button @click="gantiHalamanBerita(1, $event)" :disabled="halamanBerita === totalHalamanBerita"
                      class="px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600 text-sm font-medium inline-flex items-center gap-1.5 disabled:opacity-40 disabled:cursor-not-allowed hover:bg-slate-50 dark:hover:bg-slate-700 transition">
                <span class="hidden sm:inline">Berikutnya</span>
                <i data-lucide="chevron-right" class="w-4 h-4"></i>
              </button>
            </div>
          </template>
          </div>

          <!-- ---------------- TAB: PERNYATAAN TOKOH ---------------- -->
          <div x-show="tabKonten === 'pernyataan'">
            <p class="mt-3 text-xs text-slate-500 dark:text-slate-400 flex items-start gap-1.5">
              <span class="inline-flex items-center gap-1 text-[11px] sm:text-[10px] font-bold px-1.5 py-0.5 rounded bg-indigo-600 text-white shrink-0">
                <i data-lucide="sparkles" class="w-2.5 h-2.5"></i> AI
              </span>
              <span>Pernyataan pejabat dan tokoh yang berpotensi menggerakkan pasar. Penyaringan, penilaian dampak, dan mekanismenya dihasilkan AI.</span>
            </p>

            <template x-if="!adaPernyataan">
              <p class="mt-4 text-sm text-slate-500">Tidak ada pernyataan tokoh yang terpantau pada run ini.</p>
            </template>

            <ul class="mt-4 space-y-3">
              <template x-for="s in pernyataanTampil" :key="s.id">
                <li class="p-3 sm:p-4 rounded-lg border border-slate-200 dark:border-slate-700">
                  <div class="flex items-start justify-between gap-2 flex-wrap">
                    <div class="font-medium flex items-center gap-2 flex-wrap min-w-0">
                      <span x-text="s.tokoh"></span>
                      <span class="text-xs sm:text-[11px] px-2 py-0.5 rounded-full ring-1 ring-indigo-300 dark:ring-indigo-600/70"
                            :class="kelasStatusPernyataan(s.status)" x-text="labelStatus(s.status)"></span>
                    </div>
                    <span class="text-xs text-slate-400 whitespace-nowrap" x-text="waktuSingkat(s.waktu_utc)"></span>
                  </div>

                  <template x-if="s.kutipan">
                    <blockquote class="mt-2 pl-3 border-l-2 border-slate-300 dark:border-slate-600 text-sm italic text-slate-700 dark:text-slate-300"
                                x-text="'“' + s.kutipan + '”'"></blockquote>
                  </template>
                  <template x-if="s.ringkasan">
                    <p class="mt-2 text-sm text-slate-700 dark:text-slate-300" x-text="s.ringkasan"></p>
                  </template>

                  <div class="mt-2.5 flex flex-wrap gap-1.5 items-center">
                    <template x-if="s.dampak_btc">
                      <span class="text-xs sm:text-[11px] px-2 py-0.5 rounded-full ring-1 ring-indigo-300 dark:ring-indigo-600/70"
                            :class="kelasSentimen(s.dampak_btc)" x-text="s.dampak_btc"></span>
                    </template>
                    <template x-if="s.kekuatan">
                      <span class="text-xs sm:text-[11px] px-2 py-0.5 rounded-full ring-1 ring-indigo-300 dark:ring-indigo-600/70 bg-slate-100 dark:bg-slate-700"
                            x-text="labelDampak(s.kekuatan)"></span>
                    </template>
                    <template x-if="s.topik">
                      <span class="text-xs sm:text-[11px] px-2 py-0.5 rounded-full ring-1 ring-indigo-300 dark:ring-indigo-600/70 bg-slate-100 dark:bg-slate-700"
                            x-text="s.topik"></span>
                    </template>
                    <template x-if="s.sikap_kripto">
                      <span class="text-xs sm:text-[11px] px-2 py-0.5 rounded-full ring-1 ring-indigo-300 dark:ring-indigo-600/70 bg-slate-100 dark:bg-slate-700"
                            x-text="'sikap: ' + s.sikap_kripto"></span>
                    </template>
                  </div>

                  <template x-if="s.mekanisme">
                    <div class="mt-2.5 pl-3 border-l-2 border-indigo-300 dark:border-indigo-600/70">
                      <div class="flex items-center gap-1 text-[11px] sm:text-[10px] font-bold text-indigo-700 dark:text-indigo-300 mb-0.5">
                        <i data-lucide="sparkles" class="w-2.5 h-2.5"></i> AI · MEKANISME
                      </div>
                      <p class="text-sm text-slate-600 dark:text-slate-300" x-text="s.mekanisme"></p>
                    </div>
                  </template>

                  <div class="mt-2 text-xs text-slate-400 flex items-center gap-2 flex-wrap">
                    <span x-text="s.sumber"></span>
                    <a :href="s.url" target="_blank" rel="noopener noreferrer"
                       class="tap underline underline-offset-2 hover:text-slate-600 dark:hover:text-slate-200">buka sumber</a>
                  </div>
                </li>
              </template>
            </ul>

            <template x-if="totalHalamanPernyataan > 1">
              <div class="mt-4 flex items-center justify-between gap-3 pt-3 border-t border-slate-200 dark:border-slate-700">
                <button @click="gantiHalamanPernyataan(-1, $event)" :disabled="halamanPernyataan === 1"
                        class="px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600 text-sm font-medium inline-flex items-center gap-1.5 disabled:opacity-40 disabled:cursor-not-allowed hover:bg-slate-50 dark:hover:bg-slate-700 transition">
                  <i data-lucide="chevron-left" class="w-4 h-4"></i>
                  <span class="hidden sm:inline">Sebelumnya</span>
                </button>
                <span class="text-sm text-slate-500 dark:text-slate-400 text-center"
                      x-text="'Halaman ' + halamanPernyataan + ' dari ' + totalHalamanPernyataan + ' · ' + pernyataanTersaring.length + ' pernyataan'"></span>
                <button @click="gantiHalamanPernyataan(1, $event)" :disabled="halamanPernyataan === totalHalamanPernyataan"
                        class="px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600 text-sm font-medium inline-flex items-center gap-1.5 disabled:opacity-40 disabled:cursor-not-allowed hover:bg-slate-50 dark:hover:bg-slate-700 transition">
                  <span class="hidden sm:inline">Berikutnya</span>
                  <i data-lucide="chevron-right" class="w-4 h-4"></i>
                </button>
              </div>
            </template>
          </div>
        </section>


        <!-- Perubahan vs brief sebelumnya: konteks penutup, ditaruh di
             bawah setelah pembaca melihat kondisi hari ini. -->
          <div class="bg-white dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl p-4 sm:p-5">
            <h2 class="font-semibold flex items-center gap-2 mb-3">
              <i data-lucide="git-compare-arrows" class="w-4 h-4 text-slate-400"></i> Perubahan vs Brief Sebelumnya
            </h2>
            <template x-if="!data.diff_vs_previous?.tersedia">
              <p class="text-sm text-slate-500" x-text="data.diff_vs_previous?.alasan || 'Belum ada pembanding.'"></p>
            </template>
            <template x-if="data.diff_vs_previous?.tersedia">
              <div>
                <p class="text-xs text-slate-400 mb-2" x-text="'Dibandingkan dengan brief ' + data.diff_vs_previous.dibanding"></p>
                <ul class="space-y-1.5 text-sm">
                  <template x-for="(b, i) in (data.diff_vs_previous.ringkasan || [])" :key="i">
                    <li class="flex gap-2"><span class="text-slate-300 dark:text-slate-600">•</span><span x-text="b"></span></li>
                  </template>
                </ul>
                <template x-if="!data.diff_vs_previous.ringkasan?.length">
                  <p class="text-sm text-slate-500">Tidak ada perubahan berarti.</p>
                </template>
              </div>
            </template>
          </div>
        <!-- ================= ARSIP ================= -->
        <section class="bg-white dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl p-4 sm:p-5">
          <div class="flex items-center justify-between gap-3 flex-wrap">
            <h2 class="font-semibold flex items-center gap-2">
              <i data-lucide="archive" class="w-4 h-4 text-slate-400"></i> Arsip
            </h2>
            <div class="flex items-center gap-2">
              <select x-model="arsipDipilih" @change="bukaArsip()"
                      class="text-sm px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 max-w-[240px]">
                <option value="">Brief terbaru</option>
                <template x-for="it in daftarArsip" :key="it.file">
                  <option :value="it.file" x-text="it.waktu_wib + ' · ' + uang(it.harga)"></option>
                </template>
              </select>
              <template x-if="arsipDipilih">
                <button @click="arsipDipilih=''; bukaArsip()"
                        class="text-sm px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-600">Kembali</button>
              </template>
            </div>
          </div>
          <template x-if="arsipDipilih">
            <p class="mt-3 text-sm text-amber-700 dark:text-amber-300">
              Kamu sedang melihat arsip lama, bukan data terbaru.
            </p>
          </template>
          <template x-if="!daftarArsip.length">
            <p class="mt-3 text-sm text-slate-500">Belum ada arsip tersimpan.</p>
          </template>

          <!-- Bandingkan dua hari: arsip yang sedang tampil vs arsip lain
               pilihan, dimuat terpisah supaya tidak mengganggu tampilan utama. -->
          <template x-if="daftarArsip.length">
            <div class="mt-4 pt-4 border-t border-slate-200 dark:border-slate-700">
              <div class="flex items-center justify-between gap-3 flex-wrap">
                <h3 class="text-sm font-semibold flex items-center gap-2">
                  <i data-lucide="scale" class="w-4 h-4 text-slate-400"></i> Bandingkan dengan
                </h3>
                <select x-model="arsipBanding" @change="muatBanding()"
                        class="text-sm px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 max-w-[240px]">
                  <option value="">Pilih arsip…</option>
                  <template x-for="it in daftarArsip" :key="'banding-' + it.file">
                    <option :value="it.file" x-text="it.waktu_wib + ' · ' + uang(it.harga)"></option>
                  </template>
                </select>
              </div>

              <template x-if="memuatBanding">
                <p class="mt-3 text-sm text-slate-500">Memuat…</p>
              </template>

              <template x-if="arsipBanding && !memuatBanding && barisBanding.length">
                <div class="mt-3 overflow-x-auto">
                  <table class="w-full text-sm">
                    <thead>
                      <tr class="text-left text-slate-500 dark:text-slate-400">
                        <th class="py-1.5 pr-3 font-normal">Metrik</th>
                        <th class="py-1.5 pr-3 font-normal">Sekarang</th>
                        <th class="py-1.5 font-normal" x-text="'Dibandingkan (' + (daftarArsip.find(a => a.file === arsipBanding)?.waktu_wib || '') + ')'"></th>
                      </tr>
                    </thead>
                    <tbody>
                      <template x-for="b in barisBanding" :key="b.label">
                        <tr class="border-t border-slate-100 dark:border-slate-700/60">
                          <td class="py-1.5 pr-3 text-slate-500 dark:text-slate-400" x-text="b.label"></td>
                          <td class="py-1.5 pr-3 font-semibold" :class="b.warnaDelta" x-text="b.a"></td>
                          <td class="py-1.5 text-slate-600 dark:text-slate-300" x-text="b.b"></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </template>

              <template x-if="arsipBanding && !memuatBanding && !barisBanding.length">
                <p class="mt-3 text-sm text-slate-500">Tidak ada metrik yang bisa dibandingkan.</p>
              </template>
            </div>
          </template>
        </section>

      </div>
    </template>
  </main>

  <!-- ================= FOOTER ================= -->
  <footer class="border-t border-slate-200 dark:border-slate-700 mt-6">
    <div class="max-w-6xl mx-auto px-4 py-6 text-sm text-slate-500 dark:text-slate-400 space-y-3">

      <!-- Ajakan berlangganan versi lengkap. Tombol di header sengaja ringkas
           (labelnya hilang di ponsel), jadi di sini dijelaskan utuh. -->
      <template x-if="botTelegram">
        <div class="rounded-xl border border-sky-200 dark:border-sky-800/60 bg-sky-50 dark:bg-sky-900/20 p-4
                    flex flex-col sm:flex-row sm:items-center gap-3 justify-between">
          <div>
            <div class="font-semibold text-slate-800 dark:text-slate-100 flex items-center gap-2">
              <i data-lucide="send" class="w-4 h-4 text-sky-600 dark:text-sky-400"></i>
              Dapatkan ringkasan ini di Telegram
            </div>
            <p class="mt-1 text-xs">
              Terkirim otomatis setiap pagi. Kirim <code class="px-1 py-px rounded bg-white dark:bg-slate-800">/stop</code>
              kapan saja untuk berhenti.
            </p>
          </div>
          <a :href="'https://t.me/' + botTelegram + '?start=web'"
             target="_blank" rel="noopener noreferrer"
             class="tap inline-flex items-center justify-center gap-2 px-4 py-2 rounded-lg font-medium
                    bg-sky-500 hover:bg-sky-600 text-white transition shrink-0">
            <span>Berlangganan</span>
            <span class="opacity-80" x-text="'@' + botTelegram"></span>
          </a>
        </div>
      </template>

      <p class="flex items-start gap-2">
        <i data-lucide="info" class="w-4 h-4 mt-0.5 shrink-0"></i>
        <span x-text="data?.disclaimer || 'Konten ini bersifat informasional dan bukan saran investasi.'"></span>
      </p>
      <!-- Statistik run: berapa token dihabiskan dan berapa lama prosesnya. -->
      <template x-if="statistikRun.length">
        <p class="text-xs flex flex-wrap items-center gap-x-3 gap-y-1">
          <i data-lucide="activity" class="w-3.5 h-3.5 shrink-0"></i>
          <template x-for="s in statistikRun" :key="s.label">
            <span>
              <span class="text-slate-400" x-text="s.label + ':'"></span>
              <span class="font-medium text-slate-600 dark:text-slate-300" x-text="s.nilai"></span>
            </span>
          </template>
        </p>
      </template>

      <p class="text-xs">
        Data dihimpun otomatis dari Binance/CoinGecko/OKX, Deribit, Coin Metrics, mempool.space, alternative.me,
        Farside, Yahoo Finance, dan feed berita publik.
        Bagian bertanda <span class="inline-flex items-center gap-0.5 text-[11px] sm:text-[10px] font-bold px-1 py-px rounded bg-indigo-600 text-white">✦ AI</span>
        dihasilkan model bahasa dan dapat keliru.
      </p>
    </div>
  </footer>
</div>
</body>
</html>
