<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ringkasan Pasar Bitcoin</title>
<meta name="description" content="Ringkasan harian pasar Bitcoin: harga, teknikal, posisi pasar, makro, dan berita. Informasional, bukan saran investasi.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%E2%82%BF%3C/text%3E%3C/svg%3E">

<!-- Terapkan tema SEBELUM render supaya tidak ada kedipan (flash) -->
<script>
  (function () {
    try {
      var simpan = localStorage.getItem('theme');
      var gelap = simpan ? simpan === 'dark'
                         : window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (gelap) document.documentElement.classList.add('dark');
    } catch (e) { /* localStorage diblokir: pakai tema terang */ }
  })();
</script>

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } }
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/lucide@0.451.0/dist/umd/lucide.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
<script src="app.js"></script>

<style>
  [x-cloak] { display: none !important; }

  /* Header lengket menutupi target anchor tanpa offset ini.
     Di ponsel header lebih tinggi karena ada baris nav lompat. */
  section[id] { scroll-margin-top: 12.5rem; }
  @media (min-width: 640px) { section[id] { scroll-margin-top: 6rem; } }

  /* Perangkat sentuh: target minimal 44px sesuai pedoman iOS/Android.
     Dibatasi ke pointer kasar supaya tampilan desktop tidak ikut melar. */
  @media (pointer: coarse) {
    button, select { min-height: 44px; }
    a.tap { min-height: 44px; display: inline-flex; align-items: center; }
  }

  /* Tab isi (berita/pernyataan): lebar penuh dan mudah disentuh di ponsel */
  @media (max-width: 480px) {
    .tab-isi { flex: 1 1 0%; justify-content: center; }
  }

</style>
</head>

<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 antialiased transition-colors">
<div x-data="briefApp()" x-init="mulai()" x-cloak class="min-h-screen flex flex-col">

  <!-- ================= HEADER ================= -->
  <header class="sticky top-0 z-30 backdrop-blur bg-white/85 dark:bg-slate-900/85 border-b border-slate-200 dark:border-slate-700">
    <div class="max-w-6xl mx-auto px-4 py-3">
      <div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
          <h1 class="text-lg sm:text-xl font-bold flex items-center gap-2">
            <i data-lucide="bitcoin" class="w-5 h-5 text-amber-500 shrink-0"></i>
            <span class="truncate">Ringkasan Pasar Bitcoin</span>
          </h1>

          <!-- Waktu update terakhir, sengaja dibuat mencolok -->
          <div class="mt-1 flex flex-wrap items-center gap-x-2 gap-y-1 text-sm">
            <span class="text-slate-500 dark:text-slate-400">Terakhir diperbarui:</span>
            <span class="font-semibold text-slate-900 dark:text-white" x-text="data?.generated_at_wib || '—'"></span>
            <span class="text-xs px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300"
                  x-text="waktuRelatif"></span>
          </div>
        </div>

        <div class="flex items-center gap-2 shrink-0">
          <!-- Badge kualitas data -->
          <template x-if="data">
            <span class="inline-flex items-center gap-1.5 text-xs font-medium px-2 sm:px-2.5 py-1 rounded-full border"
                  :class="kelasKualitas"
                  :title="'Sumber gagal: ' + (data.data_quality.failed_sources.join(', ') || 'tidak ada')">
              <span class="w-1.5 h-1.5 rounded-full shrink-0" :class="kelasTitikKualitas"></span>
              <span class="hidden sm:inline">Data</span>
              <span x-text="data.data_quality.confidence"></span>
              <span class="opacity-70 hidden sm:inline"
                    x-text="data.data_quality.sources_ok + '/' + data.data_quality.sources_total"></span>
            </span>
          </template>

          <button @click="gantiTema()" :title="gelap ? 'Mode terang' : 'Mode gelap'"
                  class="p-2 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700 transition">
            <i :data-lucide="gelap ? 'sun' : 'moon'" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Nav lompat: hanya di ponsel, karena halaman ini panjang -->
    <nav class="sm:hidden border-t border-slate-200 dark:border-slate-700 overflow-x-auto"
         aria-label="Lompat ke bagian">
      <ul class="flex gap-1 px-3 py-2 w-max">
        <template x-for="n in navLompat" :key="n.id">
          <li>
            <a :href="'#' + n.id"
               class="tap px-3 py-1.5 rounded-full text-xs whitespace-nowrap bg-slate-100 dark:bg-slate-700/70 text-slate-600 dark:text-slate-300"
               x-text="n.label"></a>
          </li>
        </template>
      </ul>
    </nav>
  </header>

  <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-5 space-y-5">

    <!-- ================= MEMUAT / ERROR ================= -->
    <template x-if="memuat">
      <div class="flex items-center gap-3 justify-center py-16 text-slate-500">
        <i data-lucide="loader-circle" class="w-5 h-5 animate-spin"></i>
        <span>Memuat data…</span>
      </div>
    </template>

    <template x-if="error">
      <div class="rounded-xl border border-amber-300 dark:border-amber-700 bg-amber-50 dark:bg-amber-900/25 p-6 text-center">
        <i data-lucide="cloud-off" class="w-8 h-8 mx-auto text-amber-600 dark:text-amber-400"></i>
        <h2 class="mt-3 font-semibold text-lg">Data belum bisa dimuat</h2>
        <p class="mt-1 text-sm text-slate-600 dark:text-slate-300 max-w-md mx-auto" x-text="error"></p>
        <p class="mt-2 text-sm text-slate-500">
          Brief dibuat otomatis dua kali sehari. Kalau baru saja dipasang, tunggu jadwal berikutnya.
        </p>
        <button @click="muat()" class="mt-4 px-4 py-2 rounded-lg bg-slate-900 dark:bg-white dark:text-slate-900 text-white text-sm font-medium">
          Coba lagi
        </button>
      </div>
    </template>

    <template x-if="data && !memuat">
      <div class="space-y-5">

        <!-- ================= HARGA ================= -->
        <section id="s-harga" class="grid grid-cols-1 lg:grid-cols-3 gap-4">
          <div class="lg:col-span-2 bg-white dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl p-4 sm:p-5">
            <div class="flex items-start justify-between gap-4">
              <div>
                <div class="text-sm text-slate-500 dark:text-slate-400">Harga BTC/USD</div>
                <div class="mt-1 flex items-baseline gap-3 flex-wrap">
                  <span class="text-3xl sm:text-4xl font-bold tracking-tight" x-text="uang(data.price.last)"></span>
                  <span class="text-lg font-semibold" :class="warnaAngka(data.price.change_24h_pct)"
                        x-text="persen(data.price.change_24h_pct, 2)"></span>
                </div>
              </div>
              <i data-lucide="trending-up" class="w-6 h-6 text-slate-300 dark:text-slate-600"></i>
            </div>

            <div class="mt-4 h-40"><canvas id="grafikHarga"></canvas></div>

            <template x-if="data.tautan_luar?.length">
              <div class="mt-4 flex flex-wrap gap-2">
                <template x-for="t in data.tautan_luar" :key="t.url">
                  <a :href="t.url" target="_blank" rel="noopener noreferrer"
                     class="tap inline-flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium
                            bg-amber-500 hover:bg-amber-600 text-white transition">
                    <i :data-lucide="t.ikon || 'external-link'" class="w-4 h-4"></i>
                    <span x-text="t.label"></span>
                  </a>
                </template>
              </div>
            </template>

            <dl class="mt-4 grid grid-cols-3 gap-3 text-sm">
              <div><dt class="text-slate-500 dark:text-slate-400">Tertinggi 24j</dt>
                   <dd class="font-semibold" x-text="uang(data.price.high_24h)"></dd></div>
              <div><dt class="text-slate-500 dark:text-slate-400">Terendah 24j</dt>
                   <dd class="font-semibold" x-text="uang(data.price.low_24h)"></dd></div>
              <div><dt class="text-slate-500 dark:text-slate-400">Volume 24j</dt>
                   <dd class="font-semibold" x-text="ringkasUang(data.price.volume_24h)"></dd></div>
            </dl>
          </div>

          <!-- Sentimen berita + level kunci -->
          <div class="bg-white dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl p-4 sm:p-5 flex flex-col">
            <div class="text-sm text-slate-500 dark:text-slate-400">Skor sentimen berita</div>
            <div class="mt-1 flex items-baseline gap-2">
              <span class="text-3xl font-bold" :class="warnaAngka(data.aggregate.sentiment_score)"
                    x-text="angka(data.aggregate.sentiment_score, 1)"></span>
              <span class="text-sm text-slate-500">/ 100</span>
            </div>
            <div class="text-sm font-medium mt-0.5" x-text="data.aggregate.sentiment_label || '—'"></div>

            <!-- Batang -100..+100 -->
            <div class="mt-3 h-2 rounded-full bg-slate-200 dark:bg-slate-700 relative overflow-hidden">
              <div class="absolute top-0 bottom-0 w-px bg-slate-400 dark:bg-slate-500 left-1/2"></div>
              <div class="absolute top-0 bottom-0 rounded-full transition-all"
                   :class="data.aggregate.sentiment_score >= 0 ? 'bg-emerald-500' : 'bg-rose-500'"
                   :style="gayaBatangSentimen"></div>
            </div>

            <div class="mt-4 pt-4 border-t border-slate-200 dark:border-slate-700 space-y-2 text-sm">
              <div class="flex justify-between">
                <span class="text-slate-500 dark:text-slate-400">Support terdekat</span>
                <span class="font-semibold" x-text="uang(data.technical.key_levels.support?.[0])"></span>
              </div>
              <div class="flex justify-between">
                <span class="text-slate-500 dark:text-slate-400">Resistance terdekat</span>
                <span class="font-semibold" x-text="uang(data.technical.key_levels.resistance?.[0])"></span>
              </div>
              <div class="flex justify-between">
                <span class="text-slate-500 dark:text-slate-400">Invalidasi naik</span>
                <span class="font-semibold" x-text="uang(data.technical.key_levels.invalidasi_naik)"></span>
              </div>
              <div class="flex justify-between">
                <span class="text-slate-500 dark:text-slate-400">Invalidasi turun</span>
                <span class="font-semibold" x-text="uang(data.technical.key_levels.invalidasi_turun)"></span>
              </div>
            </div>
          </div>
        </section>

        <!-- ================= TEKNIKAL ================= -->
        <section id="s-teknikal" class="bg-white dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl">
          <div class="flex items-center justify-between gap-3 p-5 pb-3 flex-wrap">
            <h2 class="font-semibold flex items-center gap-2">
              <i data-lucide="activity" class="w-4 h-4 text-slate-400"></i> Analisa Teknikal
            </h2>
            <span class="text-xs px-2.5 py-1 rounded-full bg-slate-100 dark:bg-slate-700/70 text-slate-500 dark:text-slate-300">
              Candle harian (1D)
            </span>
          </div>

          <template x-if="!tfAktif || !tfAktif.momentum">
            <p class="px-5 pb-5 text-sm text-slate-500">Indikator harian tidak tersedia pada run terakhir.</p>
          </template>

          <template x-if="tfAktif && tfAktif.momentum">
            <div class="px-5 pb-5 grid grid-cols-1 md:grid-cols-3 gap-5">

              <div>
                <h3 class="text-xs font-semibold uppercase tracking-wide text-slate-400 mb-2">Tren</h3>
                <dl class="space-y-1.5 text-sm">
                  <template x-for="p in [20,50,100,200]" :key="p">
                    <div class="flex justify-between items-center">
                      <dt class="text-slate-500 dark:text-slate-400" x-text="'EMA ' + p"></dt>
                      <dd class="flex items-center gap-2">
                        <span x-text="uang(tfAktif.tren['ema'+p])"></span>
                        <span class="text-[11px] sm:text-[11px] sm:text-[10px] px-1.5 py-0.5 rounded font-medium"
                              :class="tfAktif.tren.posisi?.['ema'+p] === 'di_atas'
                                      ? 'bg-slate-100 text-slate-600 dark:bg-slate-700 dark:text-slate-300'
                                      : 'bg-slate-100 text-slate-500 dark:bg-slate-700 dark:text-slate-400'"
                              x-text="tfAktif.tren.posisi?.['ema'+p] === 'di_atas' ? 'harga di atas' : 'harga di bawah'"></span>
                      </dd>
                    </div>
                  </template>
                  <div class="flex justify-between pt-1">
                    <dt class="text-slate-500 dark:text-slate-400">Struktur</dt>
                    <dd class="font-medium" x-text="tfAktif.tren.struktur"></dd>
                  </div>
                  <template x-if="tfAktif.tren.cross_50_200">
                    <div class="flex justify-between">
                      <dt class="text-slate-500 dark:text-slate-400">Persilangan EMA</dt>
                      <dd class="font-medium" x-text="tfAktif.tren.cross_50_200 === 'golden_cross' ? 'Golden cross' : 'Death cross'"></dd>
                    </div>
                  </template>
                </dl>
              </div>

              <div>
                <h3 class="text-xs font-semibold uppercase tracking-wide text-slate-400 mb-2">Momentum</h3>
                <dl class="space-y-1.5 text-sm">
                  <div class="flex justify-between"><dt class="text-slate-500 dark:text-slate-400">RSI (14)</dt>
                    <dd class="font-medium"><span x-text="angka(tfAktif.momentum.rsi, 1)"></span>
                      <span class="text-slate-400 text-xs" x-text="'· ' + labelZona(tfAktif.momentum.rsi_zona)"></span></dd></div>
                  <div class="flex justify-between"><dt class="text-slate-500 dark:text-slate-400">MACD</dt>
                    <dd x-text="angka(tfAktif.momentum.macd, 1)"></dd></div>
                  <div class="flex justify-between"><dt class="text-slate-500 dark:text-slate-400">Histogram</dt>
                    <dd><span x-text="angka(tfAktif.momentum.macd_histogram, 1)"></span>
                      <span class="text-slate-400 text-xs" x-text="'· ' + tfAktif.momentum.macd_arah"></span></dd></div>
                  <div class="flex justify-between"><dt class="text-slate-500 dark:text-slate-400">Stoch RSI %K</dt>
                    <dd x-text="angka(tfAktif.momentum.stoch_rsi_k, 1)"></dd></div>
                  <template x-if="tfAktif.momentum.divergensi_rsi">
                    <div class="flex justify-between"><dt class="text-slate-500 dark:text-slate-400">Divergensi RSI</dt>
                      <dd class="font-medium" x-text="'terdeteksi (' + tfAktif.momentum.divergensi_rsi + ')'"></dd></div>
                  </template>
                </dl>
              </div>

              <div>
                <h3 class="text-xs font-semibold uppercase tracking-wide text-slate-400 mb-2">Volatilitas &amp; Volume</h3>
                <dl class="space-y-1.5 text-sm">
                  <div class="flex justify-between"><dt class="text-slate-500 dark:text-slate-400">Bollinger atas</dt>
                    <dd x-text="uang(tfAktif.volatilitas.bb_atas)"></dd></div>
                  <div class="flex justify-between"><dt class="text-slate-500 dark:text-slate-400">Bollinger bawah</dt>
                    <dd x-text="uang(tfAktif.volatilitas.bb_bawah)"></dd></div>
                  <div class="flex justify-between"><dt class="text-slate-500 dark:text-slate-400">Bandwidth</dt>
                    <dd><span x-text="angka(tfAktif.volatilitas.bb_bandwidth, 2) + '%'"></span>
                      <template x-if="tfAktif.volatilitas.bb_squeeze">
                        <span class="ml-1 text-[11px] sm:text-[10px] px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-700">menyempit</span>
                      </template></dd></div>
                  <div class="flex justify-between"><dt class="text-slate-500 dark:text-slate-400">ATR (14)</dt>
                    <dd><span x-text="uang(tfAktif.volatilitas.atr)"></span>
                      <span class="text-slate-400 text-xs" x-text="'· ' + angka(tfAktif.volatilitas.atr_pct, 2) + '%'"></span></dd></div>
                  <div class="flex justify-between"><dt class="text-slate-500 dark:text-slate-400">Volume vs rata²</dt>
                    <dd x-text="tfAktif.volume.rasio_vs_rata ? angka(tfAktif.volume.rasio_vs_rata, 2) + '×' : '—'"></dd></div>
                  <div class="flex justify-between"><dt class="text-slate-500 dark:text-slate-400">OBV</dt>
                    <dd x-text="tfAktif.volume.obv_arah"></dd></div>
                  <div class="flex justify-between"><dt class="text-slate-500 dark:text-slate-400">VWAP harian</dt>
                    <dd x-text="uang(tfAktif.volume.vwap_harian)"></dd></div>
                </dl>
              </div>

              <!-- Level -->
              <div class="md:col-span-3 pt-4 border-t border-slate-200 dark:border-slate-700">
                <h3 class="text-xs font-semibold uppercase tracking-wide text-slate-400 mb-2">Level dari candle harian</h3>
                <div class="flex flex-wrap gap-2 text-sm">
                  <template x-for="lv in (tfAktif.level.support || [])" :key="'s'+lv">
                    <span class="px-2 py-1 rounded-md bg-slate-100 dark:bg-slate-700/60">
                      <span class="text-slate-400 text-xs">S</span> <span x-text="uang(lv)"></span></span>
                  </template>
                  <template x-for="lv in (tfAktif.level.resistance || [])" :key="'r'+lv">
                    <span class="px-2 py-1 rounded-md bg-slate-100 dark:bg-slate-700/60">
                      <span class="text-slate-400 text-xs">R</span> <span x-text="uang(lv)"></span></span>
                  </template>
                  <template x-if="tfAktif.level.pivot?.pivot">
                    <span class="px-2 py-1 rounded-md bg-slate-100 dark:bg-slate-700/60">
                      <span class="text-slate-400 text-xs">Pivot</span> <span x-text="uang(tfAktif.level.pivot.pivot)"></span></span>
                  </template>
                  <template x-if="tfAktif.level.fib_618">
                    <span class="px-2 py-1 rounded-md bg-slate-100 dark:bg-slate-700/60">
                      <span class="text-slate-400 text-xs">Fib 0,618</span> <span x-text="uang(tfAktif.level.fib_618)"></span></span>
                  </template>
                </div>
              </div>
            </div>
          </template>
        </section>

        <!-- ================= POSISI PASAR + MAKRO ================= -->
        <section id="s-pasar" class="grid grid-cols-1 lg:grid-cols-2 gap-4">

          <div class="bg-white dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl p-4 sm:p-5">
            <h2 class="font-semibold flex items-center gap-2 mb-4">
              <i data-lucide="waves" class="w-4 h-4 text-slate-400"></i> Posisi Pasar
            </h2>

            <div class="grid grid-cols-2 gap-4 text-sm">
              <div><div class="text-slate-500 dark:text-slate-400">Funding rate</div>
                <div class="font-semibold text-base" :class="warnaAngka(data.market.funding_rate)"
                     x-text="tekstFunding(data.market.funding_rate)"></div></div>
              <div><div class="text-slate-500 dark:text-slate-400">Open interest</div>
                <div class="font-semibold text-base">
                  <span x-text="data.market.open_interest === null ? '—' : angka(data.market.open_interest, 0) + ' BTC'"></span>
                  <template x-if="data.technical.oi_change_pct !== null && data.technical.oi_change_pct !== undefined">
                    <span class="text-xs font-normal" :class="warnaAngka(data.technical.oi_change_pct)"
                          x-text="' ' + persen(data.technical.oi_change_pct, 1)"></span>
                  </template>
                </div></div>
              <div><div class="text-slate-500 dark:text-slate-400">Arus ETF harian</div>
                <div class="font-semibold text-base"
                     :class="data.market.etf_flow_usd === null ? '' : warnaAngka(data.market.etf_flow_usd)"
                     x-text="data.market.etf_flow_usd === null ? 'tidak tersedia' : ringkasUang(data.market.etf_flow_usd, true)"></div></div>
              <div><div class="text-slate-500 dark:text-slate-400">Hashrate</div>
                <div class="font-semibold text-base" x-text="data.market.hashrate ? angka(data.market.hashrate, 0) + ' EH/s' : '—'"></div></div>
            </div>

            <!-- Gauge Fear & Greed -->
            <template x-if="data.market.fear_greed">
              <div class="mt-5 pt-4 border-t border-slate-200 dark:border-slate-700">
                <div class="flex items-center justify-between text-sm">
                  <span class="text-slate-500 dark:text-slate-400">Fear &amp; Greed Index</span>
                  <span class="font-semibold">
                    <span x-text="data.market.fear_greed.value"></span>
                    <span class="text-slate-400 font-normal" x-text="'· ' + data.market.fear_greed.label"></span>
                  </span>
                </div>
                <div class="mt-2 h-2.5 rounded-full relative"
                     style="background:linear-gradient(90deg,#f43f5e 0%,#f59e0b 35%,#a3a3a3 50%,#84cc16 70%,#10b981 100%)">
                  <div class="absolute -top-1 w-1 h-[18px] bg-slate-900 dark:bg-white rounded-full ring-2 ring-white dark:ring-slate-800 transition-all"
                       :style="'left: calc(' + data.market.fear_greed.value + '% - 2px)'"></div>
                </div>
                <div class="flex justify-between text-[11px] sm:text-[10px] text-slate-400 mt-1">
                  <span>Takut</span><span>Netral</span><span>Serakah</span>
                </div>
              </div>
            </template>

            <!-- Interpretasi OI (hasil kode, bukan AI) -->
            <template x-if="data.technical.oi_price_interpretasi">
              <p class="mt-4 text-xs text-slate-500 dark:text-slate-400 leading-relaxed"
                 x-text="data.technical.oi_price_interpretasi"></p>
            </template>
          </div>

          <div class="bg-white dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl p-4 sm:p-5">
            <h2 class="font-semibold flex items-center gap-2 mb-4">

                  </template>
                </ul>
                <template x-if="!data.diff_vs_previous.ringkasan?.length">
                  <p class="text-sm text-slate-500">Tidak ada perubahan berarti.</p>
                </template>
              </div>
            </template>
          </div>
        </section>

        <!-- ================= ARSIP ================= -->
        <section class="bg-white dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl p-4 sm:p-5">
          <div class="flex items-center justify-between gap-3 flex-wrap">
            <h2 class="font-semibold flex items-center gap-2">
              <i data-lucide="archive" class="w-4 h-4 text-slate-400"></i> Arsip
            </h2>
            <div class="flex items-center gap-2">
              <select x-model="arsipDipilih" @change="bukaArsip()"
                      class="text-sm px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 max-w-[240px]">
                <option value="">Brief terbaru</option>
                <template x-for="it in daftarArsip" :key="it.file">
                  <option :value="it.file" x-text="it.waktu_wib + ' · ' + uang(it.harga)"></option>
                </template>
              </select>
              <template x-if="arsipDipilih">
                <button @click="arsipDipilih=''; bukaArsip()"
                        class="text-sm px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-600">Kembali</button>
              </template>
            </div>
          </div>
          <template x-if="arsipDipilih">
            <p class="mt-3 text-sm text-amber-700 dark:text-amber-300">
              Kamu sedang melihat arsip lama, bukan data terbaru.
            </p>
          </template>
          <template x-if="!daftarArsip.length">
            <p class="mt-3 text-sm text-slate-500">Belum ada arsip tersimpan.</p>
          </template>
        </section>

      </div>
    </template>
  </main>

  <!-- ================= FOOTER ================= -->
  <footer class="border-t border-slate-200 dark:border-slate-700 mt-6">
    <div class="max-w-6xl mx-auto px-4 py-6 text-sm text-slate-500 dark:text-slate-400 space-y-2">
      <p class="flex items-start gap-2">
        <i data-lucide="info" class="w-4 h-4 mt-0.5 shrink-0"></i>
        <span x-text="data?.disclaimer || 'Konten ini bersifat informasional dan bukan saran investasi.'"></span>
      </p>
      <p class="text-xs">
        Data dihimpun otomatis dari Binance/CoinGecko/OKX, Deribit, Coin Metrics, mempool.space, alternative.me,
        Farside, Yahoo Finance, dan feed berita publik.
        Bagian bertanda <span class="inline-flex items-center gap-0.5 text-[11px] sm:text-[10px] font-bold px-1 py-px rounded bg-indigo-600 text-white">✦ AI</span>
        dihasilkan model bahasa dan dapat keliru.
      </p>
    </div>
  </footer>
</div>
</body>
</html>
