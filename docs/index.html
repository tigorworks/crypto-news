<!-- Terapkan tema SEBELUM render supaya tidak ada kedipan (flash) -->
<script>
  (function () {
    try {
      var simpan = localStorage.getItem('theme');
      var gelap = simpan ? simpan === 'dark'
                         : window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (gelap) document.documentElement.classList.add('dark');
    } catch (e) { /* localStorage diblokir: pakai tema terang */ }
  })();
</script>

<style>
  [x-cloak] { display: none !important; }

  /* Pemotong dua baris untuk teks jalur di strip agenda. Ditulis manual,
     bukan memakai utility `line-clamp-2`, dengan alasan yang sama seperti
     token meter di bawah: utility yang tidak ikut ter-generate gagal DIAM —
     teksnya cuma memanjang dan strip yang seharusnya ringkas kembali
     setinggi kartu. Teks penuhnya tetap ada di bagian Agenda, yang justru
     jadi tujuan tautan strip ini. */
  .jalur-ringkas {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* Garis aksen kiri strip agenda. Ditulis sebagai properti CSS langsung,
     BUKAN `border-l-4 border-l-amber-500`, karena versi utility-nya gagal
     diam: `border` dan `border-slate-200` menimpa lebar dan warna sisi kiri
     berdasarkan urutan di stylesheet, bukan urutan penulisan di atribut
     class. Terukur di browser hasilnya 1px slate-200 — garis aksennya tidak
     pernah ada, tanpa satu pun error.

     Warnanya satu nilai untuk terang dan gelap: shade 500 cukup kontras di
     atas putih maupun slate-800, jadi tidak perlu cabang tema yang bisa
     ikut gagal diam. */
  .strip-agenda {
    /* `display` ikut ditulis di sini, tidak diserahkan ke utility `block`.
       Sebuah <a> yang tetap inline merender latar dan bordernya PECAH per
       baris — sudut membulat muncul di awal dan akhir, garis aksen terputus
       di tengah — dan itu terlihat seperti kerusakan acak, bukan seperti
       utility yang hilang. Kegagalannya juga senyap: tidak ada error, hanya
       kartu yang tampak rusak. */
    display: block;
    border-left: 4px solid var(--aksen-agenda, #94a3b8);
  }

  /* ===== Token warna meter "Peta jangkauan harga" =====
     Ditulis sebagai variabel CSS, bukan utility class, karena dua alasan:
     warnanya harus PASTI ada (utility yang tidak ikut ter-generate membuat
     penanda hilang tanpa error apa pun — kegagalan diam), dan nilainya
     sudah lolos pemeriksaan keterbacaan sehingga tidak boleh diganti
     sembarangan.

     Skemanya EMPHASIS: satu aksen untuk harga sekarang, sisanya netral.
     Batas atas dan bawah dibedakan oleh POSISI dan HURUF (S/R), bukan
     warna — merah/hijau bersebelahan di satu batang gagal uji buta warna
     (ΔE deutan 5,8, di bawah ambang 6). */
  :root {
    --meter-track:  #e2e8f0;   /* slate-200 */
    --meter-band:   #a5b4fc;   /* indigo-300 — konteks, bukan seri kedua */
    --meter-tick:   #64748b;   /* slate-500 */
    --meter-accent: #4f46e5;   /* indigo-600 — lolos semua uji pada latar terang */
    --meter-ring:   #ffffff;
  }
  .dark {
    --meter-track:  #334155;   /* slate-700 */
    --meter-band:   #3730a3;   /* indigo-800 */
    --meter-tick:   #cbd5e1;   /* slate-300 */
    --meter-accent: #6366f1;   /* indigo-500 — lolos semua uji pada latar gelap */
    --meter-ring:   #1e293b;   /* slate-800 */
  }

  /* ===== Tombol tautan luar (CTA) =====
     Sebelumnya pil datar `bg-amber-500` seukuran teks biasa — secara visual
     setara dengan label, jadi tidak pernah terbaca sebagai AJAKAN. Karena ini
     satu-satunya pintu ke produk lain di halaman ini, ia pantas punya bobot
     visual sendiri.

     Ditulis sebagai CSS, bukan utility class, dengan alasan yang sama seperti
     token meter di atas: gradien, transform, dan keyframe adalah justru jenis
     utility yang paling mungkin tidak ikut ter-generate — dan kalau itu
     terjadi tombolnya kembali datar TANPA error apa pun. */
  .cta-luar {
    position: relative;
    overflow: hidden;
    display: inline-flex;
    align-items: center;
    gap: 0.7rem;
    padding: 0.7rem 1.1rem;
    border-radius: 0.75rem;
    color: #fff;
    font-weight: 600;
    line-height: 1.2;
    text-decoration: none;
    background: linear-gradient(135deg, #f59e0b 0%, #f97316 55%, #ea580c 100%);
    box-shadow: 0 4px 14px -4px rgba(234, 88, 12, 0.55);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  .cta-luar:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 24px -6px rgba(234, 88, 12, 0.7);
  }
  .cta-luar:active { transform: translateY(0); }
  /* Fokus keyboard harus terlihat di atas gradien, jadi cincin putih DI DALAM
     plus halo oranye di luar — outline biasa tenggelam di warna terangnya. */
  .cta-luar:focus-visible {
    outline: 2px solid #fff;
    outline-offset: -4px;
    box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.55);
  }

  .cta-luar__ikon {
    display: grid;
    place-items: center;
    width: 2rem;
    height: 2rem;
    flex: none;
    border-radius: 9999px;
    background: rgba(255, 255, 255, 0.22);
  }
  .cta-luar__teks { min-width: 0; }
  .cta-luar__label { display: block; }
  .cta-luar__sub {
    display: block;
    font-size: 0.72rem;
    font-weight: 400;
    opacity: 0.9;
    margin-top: 0.1rem;
  }
  .cta-luar__panah {
    flex: none;
    margin-left: auto;
    padding-left: 0.25rem;
    transition: transform 0.18s ease;
  }
  .cta-luar:hover .cta-luar__panah { transform: translateX(3px); }
  /* Ukuran ikon dipatok di sini, bukan lewat w-4/h-4: Lucide mengganti
     elemen ikonnya jadi SVG dan menyalin kelasnya apa adanya, jadi utility
     yang hilang membuat ikon melar memenuhi tombol. */
  .cta-luar svg { width: 1rem; height: 1rem; }
  .cta-luar__ikon svg { width: 1.05rem; height: 1.05rem; }

  /* Kilau lembut yang lewat sesekali — menarik mata tanpa berkedip terus.
     Jeda panjang (65% dari siklus) sengaja: gerakan konstan mengganggu
     pembacaan di halaman yang isinya angka. */
  .cta-luar::after {
    content: "";
    position: absolute;
    top: 0;
    left: -60%;
    width: 35%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
    transform: skewX(-20deg);
    animation: cta-kilau 4s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes cta-kilau {
    0%, 65% { left: -60%; }
    100%    { left: 135%; }
  }

  /* Di ponsel jadi selebar kartu: target sentuh lebih besar dan bacaannya
     lebih tegas sebagai ajakan, bukan tempelan. */
  @media (max-width: 639px) {
    .cta-luar { width: 100%; }
  }

  /* Hormati pengguna yang meminta gerakan dikurangi — kilau dan angkatnya
     dimatikan, warnanya tetap. */
  @media (prefers-reduced-motion: reduce) {
    .cta-luar,
    .cta-luar__panah { transition: none; }
    .cta-luar:hover { transform: none; }
    .cta-luar::after { animation: none; opacity: 0; }
  }

  /* Scroll anchoring bawaan browser mencoba mengoreksi sendiri saat tinggi
     konten berubah, tapi cuma sebagian dan bertabrakan dengan koreksi kita
     sendiri di gantiHalaman*() (lihat _pindahHalamanTerjaga di app.js) —
     hasilnya malah dobel-koreksi dan tombol tetap bergeser. Dimatikan di
     sini supaya satu-satunya yang mengoreksi posisi scroll adalah kode kita. */
  html { overflow-anchor: none; }

  /* Header lengket menutupi target anchor tanpa offset ini.
     Di ponsel header lebih tinggi karena ada baris nav lompat. */
  section[id] { scroll-margin-top: 12.5rem; }
  @media (min-width: 640px) { section[id] { scroll-margin-top: 6rem; } }

  /* Perangkat sentuh: target minimal 44px sesuai pedoman iOS/Android.
     Dibatasi ke pointer kasar supaya tampilan desktop tidak ikut melar. */
  @media (pointer: coarse) {
    button, select { min-height: 44px; }
    a.tap { min-height: 44px; display: inline-flex; align-items: center; }
  }

  /* Tab isi (berita/pernyataan): lebar penuh dan mudah disentuh di ponsel */
  @media (max-width: 480px) {
    .tab-isi { flex: 1 1 0%; justify-content: center; }
  }

</style>
</head>

<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 antialiased transition-colors">
<div x-data="briefApp()" x-init="mulai()" x-cloak class="min-h-screen flex flex-col">

  <!-- ================= HEADER ================= -->
  <header class="sticky top-0 z-30 backdrop-blur bg-white/85 dark:bg-slate-900/85 border-b border-slate-200 dark:border-slate-700">
    <div class="max-w-6xl mx-auto px-4 py-3">
      <div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
          <!-- Kunci merek: nama SELALU utuh, deskriptor yang mengalah.
               Nama lama "Ringkasan Pasar Bitcoin" terpotong jadi "Ringkasan
               Pas…" di layar 390px, jadi pembaca ponsel tidak pernah melihat
               nama produknya sama sekali. `shrink-0` pada nama menjamin ia
               tidak pernah terpotong; deskriptornya MEMBUNGKUS ke baris
               berikutnya alih-alih dipotong, karena ruang di bawah masih
               kosong dan tagline yang terbaca utuh lebih berguna daripada
               "Ringkasan Pa…". -->
          <h1 class="text-lg sm:text-xl font-bold flex items-baseline flex-wrap gap-x-2 gap-y-0.5 min-w-0">
            <i data-lucide="newspaper" class="w-5 h-5 text-amber-500 shrink-0 self-center"></i>
            <span class="shrink-0">Nawala</span>
            <span class="text-xs sm:text-sm font-normal text-slate-500 dark:text-slate-400">Ringkasan Pasar Kripto</span>
          </h1>

          <!-- Waktu update terakhir, sengaja dibuat mencolok -->
          <div class="mt-1 flex flex-wrap items-center gap-x-2 gap-y-1 text-sm">
            <span class="text-slate-500 dark:text-slate-400">Terakhir diperbarui:</span>
            <span class="font-semibold text-slate-900 dark:text-white" x-text="data?.generated_at_wib || '—'"></span>
            <span class="text-xs px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300"
                  x-text="waktuRelatif"></span>
          </div>
        </div>

        <div class="flex items-center gap-2 shrink-0">
          <!-- Badge kualitas data -->
          <template x-if="data">
            <span class="inline-flex items-center gap-1.5 text-xs font-medium px-2 sm:px-2.5 py-1 rounded-full border"
                  :class="kelasKualitas"
                  :title="'Sumber gagal: ' + (sumberGagalTampil.join(', ') || 'tidak ada')">
              <span class="w-1.5 h-1.5 rounded-full shrink-0" :class="kelasTitikKualitas"></span>
              <span class="hidden sm:inline">Data</span>
              <span x-text="data.data_quality.confidence"></span>
              <span class="opacity-70 hidden sm:inline"
                    x-text="data.data_quality.sources_ok + '/' + data.data_quality.sources_total"></span>
            </span>
          </template>

          <!-- Berlangganan lewat Telegram. `?start=web` membuat Telegram
               menampilkan tombol MULAI yang langsung mengirim /start, jadi
               pembaca tidak perlu mengetiknya sendiri. Parameternya diabaikan
               parser perintah kita, yang cuma membaca kata pertama. -->
          <template x-if="botTelegram">
            <a :href="'https://t.me/' + botTelegram + '?start=web'"
               target="_blank" rel="noopener noreferrer"
               title="Berlangganan ringkasan harian lewat Telegram"
               class="tap inline-flex items-center gap-1.5 px-2.5 sm:px-3 py-1.5 rounded-lg text-sm font-medium
                      bg-sky-500 hover:bg-sky-600 text-white transition shrink-0">
              <i data-lucide="send" class="w-4 h-4"></i>
              <span class="hidden sm:inline">Berlangganan</span>
            </a>
          </template>

          <button @click="gantiTema()" :title="gelap ? 'Mode terang' : 'Mode gelap'"
                  class="p-2 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700 transition">
            <i :data-lucide="gelap ? 'sun' : 'moon'" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

    </div>

    <!-- Notice agenda mendesak: ditaruh di dalam header sticky supaya tetap
         terlihat walau halaman sudah discroll — event penting <24 jam tidak
         boleh terlewat walau pembaca sedang membaca bagian lain. -->
    <template x-if="agendaMendesak.length">
      <div class="bg-rose-600 dark:bg-rose-700 text-white border-t border-rose-700 dark:border-rose-800">
        <div class="max-w-6xl mx-auto px-4 py-2 flex items-center gap-2 text-sm font-medium flex-wrap">
          <i data-lucide="alarm-clock" class="w-4 h-4 shrink-0 animate-pulse"></i>
          <span class="shrink-0">Agenda penting &lt;24 jam:</span>
          <template x-for="a in agendaMendesak" :key="a.waktu_utc + a.nama">
            <a href="#s-agenda" class="underline underline-offset-2 hover:no-underline"
               x-text="a.nama + ' · ' + a.waktu_wib"></a>
          </template>
        </div>
      </div>
    </template>

    <!-- Nav lompat: hanya di ponsel, karena halaman ini panjang -->
    <nav class="sm:hidden border-t border-slate-200 dark:border-slate-700 overflow-x-auto"
         aria-label="Lompat ke bagian">
      <ul class="flex gap-1 px-3 py-2 w-max">
        <template x-for="n in navLompat" :key="n.id">
          <li>
            <a :href="'#' + n.id"
               class="tap px-3 py-1.5 rounded-full text-xs whitespace-nowrap bg-slate-100 dark:bg-slate-700/70 text-slate-600 dark:text-slate-300"
               x-text="n.label"></a>
          </li>
        </template>
      </ul>
    </nav>
  </header>

  <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-5 space-y-5">

    <!-- ================= MEMUAT / ERROR ================= -->
    <template x-if="memuat">
      <div class="flex items-center gap-3 justify-center py-16 text-slate-500">
        <i data-lucide="loader-circle" class="w-5 h-5 animate-spin"></i>
        <span>Memuat data…</span>
      </div>
    </template>

    <template x-if="error">
      <div class="rounded-xl border border-amber-300 dark:border-amber-700 bg-amber-50 dark:bg-amber-900/25 p-6 text-center">
        <i data-lucide="cloud-off" class="w-8 h-8 mx-auto text-amber-600 dark:text-amber-400"></i>
        <h2 class="mt-3 font-semibold text-lg">Data belum bisa dimuat</h2>
        <p class="mt-1 text-sm text-slate-600 dark:text-slate-300 max-w-md mx-auto" x-text="error"></p>
        <p class="mt-2 text-sm text-slate-500">
          Brief dibuat otomatis setiap pagi. Kalau baru saja dipasang atau baru direset, tunggu jadwal berikutnya.
        </p>
        <button @click="muat()" class="mt-4 px-4 py-2 rounded-lg bg-slate-900 dark:bg-white dark:text-slate-900 text-white text-sm font-medium">
          Coba lagi
        </button>
      </div>
    </template>

    <template x-if="data && !memuat">
      <div class="space-y-5">

        <!-- ================= RINGKASAN AI (paling atas) =================
             Vonis singkat sebelum apa pun: judul temuan + arah pergerakan 24
             jam beserta JENISNYA. Pembaca yang cuma punya sepuluh detik dapat
             MAKNA, bukan sekadar harga dan skor sentimen.

             Ditempatkan PALING ATAS, di atas bar "Yang ditunggu": bar itu
             berisi hal yang akan datang, sedangkan kartu ini vonis atas apa
             yang SUDAH terjadi — dan pembaca butuh tahu di mana ia berdiri
             sebelum diberi tahu apa yang menunggu.

             Analisa lengkapnya sengaja TIDAK dipindah ke sini: bagian itu
             tingginya belasan ribu piksel di ponsel, dan menaruhnya di atas
             akan mengubur harga jauh di bawah lipatan. Kartu ini pintu
             masuknya, tautan di bawah membawa ke uraian penuh.

             Panel pergerakan di dalamnya dihitung KODE, jadi kartu ini tetap
             berisi walaupun narasi AI gagal atau ditahan critic. -->
        <template x-if="pergerakan24j?.arah || (bagianAiTampil('narasi') && data?.ai?.bagian?.judul)">
          <!-- Lede halaman, bukan alarm. Border tebalnya sengaja DILEPAS dan
               diganti bobot tipografi: judulnya yang membesar, bukan kotaknya.
               Sebelumnya kartu ini memakai border-2 bertint persis seperti dua
               kartu tetangganya, sehingga tiga hal yang sifatnya berbeda —
               interupsi, lede, pengingat — tampil sebagai tiga kotak setara
               dan tidak ada yang menang. -->
          <section class="rounded-xl border border-indigo-200/80 dark:border-indigo-800/50 bg-indigo-50/60 dark:bg-indigo-950/30 p-4 sm:p-5">
            <div class="flex items-center gap-1.5 text-xs font-bold text-indigo-700 dark:text-indigo-300">
              <i data-lucide="sparkles" class="w-3.5 h-3.5"></i> RINGKASAN AI
            </div>

            <template x-if="bagianAiTampil('narasi') && data?.ai?.bagian?.judul">
              <h2 class="mt-1 text-xl sm:text-2xl font-bold leading-snug tracking-tight" x-text="data.ai.bagian.judul"></h2>
            </template>

            <template x-if="pergerakan24j?.arah">
              <div class="mt-3 flex items-start gap-2.5">
                <i :data-lucide="kelasPergerakan.ikon" class="w-5 h-5 mt-0.5 shrink-0" :class="kelasPergerakan.teks"></i>
                <div class="min-w-0">
                  <div class="flex flex-wrap items-baseline gap-x-2 gap-y-1">
                    <span class="text-base font-bold" :class="kelasPergerakan.teks" x-text="labelArah24j"></span>
                    <span class="text-xs px-1.5 py-0.5 rounded-full bg-white/70 dark:bg-slate-800/60 text-slate-600 dark:text-slate-300"
                          x-text="'pergerakan ' + labelBesaran24j"></span>
                  </div>
                  <template x-if="pergerakan24j.jenis_ringkas">
                    <p class="mt-1 text-sm text-slate-700 dark:text-slate-200"
                       x-text="'Sifatnya: ' + pergerakan24j.jenis_ringkas + '.'"></p>
                  </template>
                  <template x-if="!pergerakan24j.jenis && pergerakan24j.arah !== 'datar'">
                    <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">
                      Sifat pergerakannya belum bisa dipastikan pada run ini.
                    </p>
                  </template>
                </div>
              </div>
            </template>

            <a href="#s-ai" class="mt-3 inline-flex items-center gap-1 text-sm text-indigo-700 dark:text-indigo-300 hover:underline">
              <span>Baca analisa lengkap</span> <i data-lucide="arrow-down" class="w-3.5 h-3.5"></i>
            </a>
          </section>
        </template>

        <!-- ============ PENGINGAT AGENDA BESAR (3 HARI KE DEPAN) ============
             Satu agenda saja: yang dampaknya ke kripto PALING BESAR dalam tiga
             hari mendatang. Sengaja satu, bukan daftar — daftar lengkapnya
             sudah ada di bagian Agenda, dan slot teratas ini gunanya justru
             memaksa satu hal saja yang diingat.

             Ambangnya `relevansi_kripto >= 4` ("dampak besar"), sama dengan
             ambang yang dipakai filter agenda dan notice <24 jam, supaya
             "besar" berarti hal yang sama di seluruh halaman.

             Kartunya HILANG sepenuhnya kalau tidak ada yang lolos ambang —
             slot teratas terlalu mahal untuk diisi kalimat "tidak ada apa-apa". -->
        <!-- ================= YANG DITUNGGU =================
             Satu bar menggantikan dua kartu terpisah (siaga kebijakan dan
             agenda besar). Keduanya menjawab pertanyaan yang sama — apa yang
             bisa menggerakkan pasar, dan kapan — jadi satu garis waktu lebih
             jujur daripada dua kotak yang saling berebut perhatian.

             Isinya sengaja pendek: uraian penuh ada di bagian SIAGA KEBIJAKAN
             dan Agenda di bawah. Dengan begitu tinggi bagian teratas tidak
             lagi bergantung pada seberapa panjang tulisan model hari itu.

             Warna kontainer mengikuti urgensi tertinggi di antara barisnya,
             sehingga hari genting tetap berteriak walau widget-nya digabung.

             Hitung mundurnya HIDUP, dihitung ulang tiap menit dari instant
             absolut. Halaman ini dibaca kapan saja; selisih yang dibekukan
             saat brief dibuat akan berbohong sepanjang sisa hari. -->
        <template x-if="barisDitunggu.length">
          <section class="rounded-xl p-4 sm:p-5" :class="kelasBarDitunggu">
            <div class="flex items-center gap-1.5 text-xs font-bold text-slate-500 dark:text-slate-400">
              <i data-lucide="clock" class="w-3.5 h-3.5"></i> YANG DITUNGGU
            </div>

                    </template>
                  </div>
                  <i data-lucide="chevron-right" class="w-4 h-4 shrink-0 text-slate-400 mt-0.5"></i>
                </a>
              </template>
            </div>
          </section>
        </template>

        <!-- ================= HARGA ================= -->
        <section id="s-harga" class="grid grid-cols-1 lg:grid-cols-3 gap-4">

            <div class="flex items-start justify-between gap-4">
              <div>
                <div class="text-sm text-slate-500 dark:text-slate-400">Harga BTC/USD</div>
                <div class="mt-1 flex items-baseline gap-3 flex-wrap">
                  <span class="text-3xl sm:text-4xl font-bold tracking-tight" x-text="uang(data.price.last)"></span>
                  <span class="text-lg font-semibold" :class="warnaAngka(data.price.change_24h_pct)"
                        x-text="persen(data.price.change_24h_pct, 2)"></span>
                </div>
                <div class="mt-1 flex items-center gap-1 text-xs text-slate-400 dark:text-slate-500">
                  <i data-lucide="clock" class="w-3 h-3 shrink-0"></i>

            <div class="mt-4 h-40"><canvas id="grafikHarga"></canvas></div>

            <template x-if="data.tautan_luar?.length">

                  <a :href="t.url" target="_blank" rel="noopener noreferrer" class="tap cta-luar">

                      <i :data-lucide="t.ikon || 'external-link'"></i>

                      <span class="cta-luar__label" x-text="t.label"></span>

                        <span class="cta-luar__sub" x-text="t.deskripsi"></span>

              </div>

            <dl class="mt-4 grid grid-cols-3 gap-3 text-sm">

                   <dd class="font-semibold" x-text="uang(data.price.high_24h)"></dd></div>
              <div><dt class="text-slate-500 dark:text-slate-400">Terendah 24j</dt>
                   <dd class="font-semibold" x-text="uang(data.price.low_24h)"></dd></div>
              <div><dt class="text-slate-500 dark:text-slate-400">Volume 24j</dt>
                   <dd class="font-semibold" x-text="ringkasUang(data.price.volume_24h)"></dd></div>
            </dl>
          </div>

          <!-- Sentimen berita + level kunci -->
          <div class="bg-white dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl p-4 sm:p-5 flex flex-col">
            <div class="text-sm text-slate-500 dark:text-slate-400">Skor sentimen berita</div>
            <div class="mt-1 flex items-baseline gap-2">
              <!-- Skalanya -100 (bearish penuh) sampai +100 (bullish penuh),
                   BUKAN 0-100 — "/100" lama gampang salah dibaca seolah skor
                   selalu positif, apalagi saat angkanya negatif. -->
              <span class="text-3xl font-bold" :class="warnaAngka(data.aggregate.sentiment_score)"
                    x-text="(data.aggregate.sentiment_score > 0 ? '+' : '') + angka(data.aggregate.sentiment_score, 1)"></span>
              <span class="text-sm text-slate-500">dari -100..+100</span>

            <div class="text-sm font-medium mt-0.5" x-text="data.aggregate.sentiment_label || '—'"></div>

            <!-- Batang -100..+100 -->
            <div class="mt-3 h-2 rounded-full bg-slate-200 dark:bg-slate-700 relative overflow-hidden">
              <div class="absolute top-0 bottom-0 w-px bg-slate-400 dark:bg-slate-500 left-1/2"></div>
              <div class="absolute top-0 bottom-0 rounded-full transition-all"

              <div class="flex justify-between">

                <span class="font-semibold" x-text="uang(data.technical.key_levels.support?.[0])"></span>
              </div>
              <div class="flex justify-between">
                <span class="text-slate-500 dark:text-slate-400">Resistance terdekat</span>
                <span class="font-semibold" x-text="uang(data.technical.key_levels.resistance?.[0])"></span>
              </div>
              <div class="flex justify-between">
                <span class="text-slate-500 dark:text-slate-400">Invalidasi naik</span>
                <span class="font-semibold" x-text="uang(data.technical.key_levels.invalidasi_naik)"></span>
              </div>
              <div class="flex justify-between">
                <span class="text-slate-500 dark:text-slate-400">Invalidasi turun</span>
                <span class="font-semibold" x-text="uang(data.technical.key_levels.invalidasi_turun)"></span>
              </div>
            </div>
          </div>
        </section>

        <!-- ================= TEKNIKAL ================= -->

              <i data-lucide="activity" class="w-4 h-4 text-slate-400"></i> Analisa Teknikal

              Candle harian (1D)
            </span>

            <p class="px-5 pb-5 text-sm text-slate-500">Indikator harian tidak tersedia pada run terakhir.</p>

                  <template x-for="p in [20,50,100,200]" :key="p">
                    <div class="flex justify-between items-center">
                      <dt class="text-slate-500 dark:text-slate-400" x-text="'EMA ' + p"></dt>
                      <dd class="flex items-center gap-2">
                        <span x-text="uang(tfAktif.tren['ema'+p])"></span>
                        <span class="text-[11px] sm:text-[11px] sm:text-[10px] px-1.5 py-0.5 rounded font-medium"
                              :class="tfAktif.tren.posisi?.['ema'+p] === 'di_atas'
                                      ? 'bg-slate-100 text-slate-600 dark:bg-slate-700 dark:text-slate-300'
                                      : 'bg-slate-100 text-slate-500 dark:bg-slate-700 dark:text-slate-400'"
                              x-text="tfAktif.tren.posisi?.['ema'+p] === 'di_atas' ? 'harga di atas' : 'harga di bawah'"></span>
                      </dd>
                    </div>
                  </template>
                  <div class="flex justify-between pt-1">
                    <dt class="text-slate-500 dark:text-slate-400">Struktur</dt>
                    <dd class="font-medium" x-text="tfAktif.tren.struktur"></dd>
                  </div>
                  <template x-if="tfAktif.tren.cross_50_200">
                    <div class="flex justify-between">
                      <dt class="text-slate-500 dark:text-slate-400">Persilangan EMA</dt>
                      <dd class="font-medium" x-text="tfAktif.tren.cross_50_200 === 'golden_cross' ? 'Golden cross' : 'Death cross'"></dd>
                    </div>
                  </template>
                </dl>
              </div>

              <div>
                <h3 class="text-xs font-semibold uppercase tracking-wide text-slate-400 mb-2">Momentum</h3>
                <dl class="space-y-1.5 text-sm">
                  <div class="flex justify-between"><dt class="text-slate-500 dark:text-slate-400">RSI (14)</dt>
                    <dd class="font-medium"><span x-text="angka(tfAktif.momentum.rsi, 1)"></span>
                      <span class="text-slate-400 text-xs" x-text="'· ' + labelZona(tfAktif.momentum.rsi_zona)"></span></dd></div>
                  <div class="flex justify-between"><dt class="text-slate-500 dark:text-slate-400">MACD</dt>
                    <dd x-text="angka(tfAktif.momentum.macd, 1)"></dd></div>
                  <div class="flex justify-between"><dt class="text-slate-500 dark:text-slate-400">Histogram</dt>
                    <dd><span x-text="angka(tfAktif.momentum.macd_histogram, 1)"></span>
                      <span class="text-slate-400 text-xs" x-text="'· ' + tfAktif.momentum.macd_arah"></span></dd></div>
                  <div class="flex justify-between"><dt class="text-slate-500 dark:text-slate-400">Stoch RSI %K</dt>
                    <dd x-text="angka(tfAktif.momentum.stoch_rsi_k, 1)"></dd></div>
                  <template x-if="tfAktif.momentum.divergensi_rsi">
                    <div class="flex justify-between"><dt class="text-slate-500 dark:text-slate-400">Divergensi RSI</dt>
                      <dd class="font-medium" x-text="'terdeteksi (' + tfAktif.momentum.divergensi_rsi + ')'"></dd></div>
                  </template>
                </dl>
              </div>

              <div>
                <h3 class="text-xs font-semibold uppercase tracking-wide text-slate-400 mb-2">Volatilitas &amp; Volume</h3>
                <dl class="space-y-1.5 text-sm">
                  <div class="flex justify-between"><dt class="text-slate-500 dark:text-slate-400">Bollinger atas</dt>
                    <dd x-text="uang(tfAktif.volatilitas.bb_atas)"></dd></div>
                  <div class="flex justify-between"><dt class="text-slate-500 dark:text-slate-400">Bollinger bawah</dt>
                    <dd x-text="uang(tfAktif.volatilitas.bb_bawah)"></dd></div>
                  <div class="flex justify-between"><dt class="text-slate-500 dark:text-slate-400">Bandwidth</dt>
                    <dd><span x-text="angka(tfAktif.volatilitas.bb_bandwidth, 2) + '%'"></span>
                      <template x-if="tfAktif.volatilitas.bb_squeeze">
                        <span class="ml-1 text-[11px] sm:text-[10px] px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-700">menyempit</span>
                      </template></dd></div>
                  <div class="flex justify-between"><dt class="text-slate-500 dark:text-slate-400">ATR (14)</dt>
                    <dd><span x-text="uang(tfAktif.volatilitas.atr)"></span>
                      <span class="text-slate-400 text-xs" x-text="'· ' + angka(tfAktif.volatilitas.atr_pct, 2) + '%'"></span></dd></div>
                  <div class="flex justify-between"><dt class="text-slate-500 dark:text-slate-400">Volume vs rata²</dt>
                    <dd x-text="tfAktif.volume.rasio_vs_rata ? angka(tfAktif.volume.rasio_vs_rata, 2) + '×' : '—'"></dd></div>
                  <div class="flex justify-between"><dt class="text-slate-500 dark:text-slate-400">OBV</dt>
                    <dd x-text="tfAktif.volume.obv_arah"></dd></div>
                  <div class="flex justify-between"><dt class="text-slate-500 dark:text-slate-400">VWAP harian</dt>
                    <dd x-text="uang(tfAktif.volume.vwap_harian)"></dd></div>
                </dl>
              </div>

              <!-- Level -->
              <div class="md:col-span-3 pt-4 border-t border-slate-200 dark:border-slate-700">
                <h3 class="text-xs font-semibold uppercase tracking-wide text-slate-400 mb-2">Level dari candle harian</h3>
                <div class="flex flex-wrap gap-2 text-sm">
                  <template x-for="lv in (tfAktif.level.support || [])" :key="'s'+lv">
                    <span class="px-2 py-1 rounded-md bg-slate-100 dark:bg-slate-700/60">
                      <span class="text-slate-400 text-xs">S</span> <span x-text="uang(lv)"></span></span>
                  </template>
                  <template x-for="lv in (tfAktif.level.resistance || [])" :key="'r'+lv">
                    <span class="px-2 py-1 rounded-md bg-slate-100 dark:bg-slate-700/60">
                      <span class="text-slate-400 text-xs">R</span> <span x-text="uang(lv)"></span></span>
                  </template>
                  <template x-if="tfAktif.level.pivot?.pivot">
                    <span class="px-2 py-1 rounded-md bg-slate-100 dark:bg-slate-700/60">
                      <span class="text-slate-400 text-xs">Pivot</span> <span x-text="uang(tfAktif.level.pivot.pivot)"></span></span>
                  </template>
                  <template x-if="tfAktif.level.fib_618">
                    <span class="px-2 py-1 rounded-md bg-slate-100 dark:bg-slate-700/60">
                      <span class="text-slate-400 text-xs">Fib 0,618</span> <span x-text="uang(tfAktif.level.fib_618)"></span></span>
                  </template>
                </div>
              </div>
            </div>
          </template>
        </section>
        <!-- ================= POSISI PASAR + MAKRO ================= -->
        <section id="s-pasar" class="grid grid-cols-1 lg:grid-cols-2 gap-4">

          <div class="bg-white dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl p-4 sm:p-5">
            <h2 class="font-semibold flex items-center gap-2 mb-4">
              <i data-lucide="waves" class="w-4 h-4 text-slate-400"></i> Posisi Pasar

              <div><div class="text-slate-500 dark:text-slate-400">Funding rate</div>

                     x-text="tekstFunding(data.market.funding_rate)"></div>

                <template x-if="data.market.funding_persisten_jam">
                  <div class="text-xs text-slate-400" x-text="labelPersistensiFunding(data.market.funding_persisten_jam)"></div>
                </template></div>
              <div><div class="text-slate-500 dark:text-slate-400">Open interest</div>
                <div class="font-semibold text-base">
                  <span x-text="data.market.open_interest === null ? '—' : angka(data.market.open_interest, 0) + ' BTC'"></span>
                  <template x-if="data.technical.oi_change_pct !== null && data.technical.oi_change_pct !== undefined">
                    <span class="text-xs font-normal" :class="warnaAngka(data.technical.oi_change_pct)"
                          x-text="' ' + persen(data.technical.oi_change_pct, 1)"></span>

                     :class="data.market.etf_flow_usd === null ? '' : warnaAngka(data.market.etf_flow_usd)"

                <template x-if="data.market.etf_flow_kedaluwarsa && data.market.etf_flow_date">

                <div class="font-semibold text-base" x-text="data.market.btc_dominance_pct ? angka(data.market.btc_dominance_pct, 1) + '%' : '—'"></div></div>
              <div><div class="text-slate-500 dark:text-slate-400">Fee tercepat</div>
                <div class="font-semibold text-base" x-text="data.market.fee_fastest_sat_vb ? data.market.fee_fastest_sat_vb + ' sat/vB' : '—'"></div></div>

                  </span>

              </div>
            </template>
          </div>
