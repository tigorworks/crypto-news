name: btc-brief

on:
  schedule:
    # 23:15 UTC = 06:15 WIB. Sengaja BUKAN 00:00 UTC (07:00 WIB): candle
    # harian Binance berganti tepat di 00:00 UTC, jadi menjalankan brief di
    # jam itu membuat candle 1D baru berumur nol menit — volume nyaris nol
    # dan VWAP harian tidak bermakna. Pada 23:15 UTC candle sudah terisi
    # 23,25 jam (97%), sesi AS sudah tutup, dan arus ETF harian sudah terbit.
    #
    # Digeser dari 23:30 karena cron GitHub TIDAK tepat waktu — antreannya
    # kerap menunda eksekusi sepuluh menit atau lebih. Dengan pipeline yang
    # butuh ~8 menit, jadwal 23:30 hanya menyisakan margin tipis sebelum
    # pergantian candle; molor setengah jam akan membuat run dimulai setelah
    # 00:00 UTC dan membaca candle harian yang baru lahir. 23:15 memberi
    # margin 45 menit.
    #
    # Satu-satunya jadwal cron — jangan tambah entri lain tanpa alasan kuat,
    # supaya briefnya tetap terbit sekali sehari pada jam yang bisa diandalkan.
    - cron: '15 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brief
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Jalankan pipeline
        run: python -m src.main
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TELEGRAM_SUBSCRIBER_KEY: ${{ secrets.TELEGRAM_SUBSCRIBER_KEY }}
          SOSO_KEY: ${{ secrets.SOSO_KEY }}

      - name: Commit hasil
        run: |
          git config user.name "btc-bot"
          git config user.email "bot@users.noreply.github.com"
          # docs/index.html ikut: pipeline menstempel sidik jari app.js ke
          # tag <script> di sana supaya browser tidak memakai kode lama.
          git add docs/data docs/index.html state
          git diff --staged --quiet || git commit -m "brief $(date -u +%F-%H%M)"
          # Jadwal pagi dan sore bisa bertabrakan dengan commit lain di main.
          git pull --rebase origin ${{ github.ref_name }} || true
          git push
