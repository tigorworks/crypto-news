name: btc-brief

on:
  schedule:
    # 23:30 UTC = 06:30 WIB. Sengaja BUKAN 00:00 UTC (07:00 WIB): candle
    # harian Binance berganti tepat di 00:00 UTC, jadi menjalankan brief di
    # jam itu membuat candle 1D baru berumur nol menit — volume nyaris nol
    # dan VWAP harian tidak bermakna. Pada 23:30 UTC candle sudah terisi
    # 23,5 jam, sesi AS sudah tutup, dan arus ETF harian sudah terbit.
    # Satu-satunya jadwal cron — jangan tambah entri lain tanpa alasan kuat,
    # supaya briefnya tetap terbit sekali sehari pada jam yang bisa diandalkan.
    - cron: '30 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brief
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Jalankan pipeline
        run: python -m src.main
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TELEGRAM_SUBSCRIBER_KEY: ${{ secrets.TELEGRAM_SUBSCRIBER_KEY }}

      - name: Commit hasil
        run: |
          git config user.name "btc-bot"
          git config user.email "bot@users.noreply.github.com"
          # docs/index.html ikut: pipeline menstempel sidik jari app.js ke
          # tag <script> di sana supaya browser tidak memakai kode lama.
          git add docs/data docs/index.html state
          git diff --staged --quiet || git commit -m "brief $(date -u +%F-%H%M)"
          # Jadwal pagi dan sore bisa bertabrakan dengan commit lain di main.
          git pull --rebase origin ${{ github.ref_name }} || true
          git push
