# Konfigurasi Bitcoin Market Brief
# Semua nilai di sini aman untuk repo publik (tidak ada kredensial).

symbol: BTCUSDT

# Brief ini terbit sekali sehari, jadi analisanya bertumpu pada candle HARIAN.
# Timeframe 4H dan 1H sudah dibuang: pada laporan harian keduanya cuma menambah
# derau, dan pernah membuat pemeriksa fakta salah menuduh angka 1H sebagai
# karangan karena tertukar dengan angka 4H.
timeframes: [1d]

# Candle halus yang TIDAK ikut dianalisa/ditampilkan. Dipakai satu hal saja:
# mengukur reaksi harga satu jam setelah sebuah berita terbit.
timeframe_reaksi: 1h

candle_limit: 250

llm:
  base_url: https://openrouter.ai/api/v1
  # Setiap step memakai array agar OpenRouter otomatis fallback ke model berikutnya
  # kalau model pertama error / rate limit / kehabisan kapasitas.
  #
  # ISI SENDIRI setelah mengecek katalog https://openrouter.ai/models
  # Aturan praktis — PENGAMBILAN/PENYIAPAN DATA memakai DeepSeek (cadangan
  # Haiku), PENULISAN ANALISA memakai GPT-5.1 (cadangan Sonnet 5):
  #   filter    -> DeepSeek (tugasnya cuma memberi skor 0-100)
  #   classify  -> DeepSeek (JSON terstruktur per artikel)
  #   format    -> DeepSeek, cuma menata pesan Telegram
  #   agenda    -> DeepSeek, ekstraksi teks-ke-JSON dari investing.com
  #   riset     -> DeepSeek, mengusulkan kueri pencarian berita hari ini
  #   x_posts   -> GROK (wajib xAI: cuma Grok yang bisa mencari di X)
  #   agenda_dampak -> DeepSeek, menilai dampak agenda ke kripto
  #   mechanism -> DeepSeek, keterangan pendek per berita
  #   statements-> DeepSeek (menyaring pernyataan tokoh dari derau berita)
  #   technical -> model menengah/kuat (MENAFSIRKAN indikator, bukan menghitung)
  #   whale     -> model menengah/kuat (membaca posisi whale vs ritel)
  #   synthesis -> model kuat (menulis analisa panjang bersebab-akibat)
  #   outlook   -> model kuat (pandangan ke depan: teknikal+makro+geopolitik)
  #   critic    -> model kuat dari KELUARGA BERBEDA dengan synthesis,
  #                supaya bias model tidak saling menutupi
  #
  # Cek ulang daftar ini secara berkala:  python -m scripts.list_models
  # Katalog OpenRouter berubah cukup sering; model bisa pensiun atau berganti
  # slug. Model yang tidak dikenali akan otomatis jatuh ke cadangan di
  # sebelahnya, dan kalau dua-duanya gagal step-nya dilewati tanpa
  # menggagalkan brief.

  # ------------------------------------------------------------------
  # LANGKAH PENGAMBILAN & PENYIAPAN DATA — DeepSeek utama, Haiku cadangan.
  # Semua langkah di blok ini cuma mengubah data jadi data: memberi skor,
  # mengklasifikasi, mengekstrak jadwal, mengusulkan kueri pencarian. Tidak
  # ada satupun yang menulis prosa yang dibaca pengguna, jadi model termurah
  # yang masih cukup patuh format sudah memadai — beda dengan technical/
  # whale/synthesis/outlook di bawah, tempat kualitas tulisan benar-benar
  # dibaca orang.
  #
  # DeepSeek V3.2 ~$0,21/$0,31 per 1 juta token (in/out) vs Haiku 4.5
  # ~$1/$5 — sekitar 5-16x lebih murah. Riwayatnya: DeepSeek sempat kurang
  # patuh format (menulis skala 1-5 sebagai angka Romawi, "kekuatan": III,
  # dan menggugurkan satu batch pernyataan utuh), makanya dulu ditaruh
  # sebagai cadangan Haiku, bukan utama. Sekarang dibalik demi penghematan —
  # Haiku tetap terpasang persis untuk hari kepatuhan formatnya meleset.
  #
  # Riwayat lain: sempat dicoba `stealth/ox-alpha` (model preview gratis
  # OpenRouter, konteks 1 juta token, identitas provider dirahasiakan) di
  # sini, lalu DIBATALKAN setelah dua insiden produksi 22 Agustus dalam
  # satu hari — batch `filter` kepotong karena jauh lebih verbose dari
  # model lain untuk tugas sederhana ini, lalu satu run penuh (21 langkah)
  # kena cancel oleh timeout 15 menit di brief.yml karena tiap panggilannya
  # 5-10x lebih lambat dari Haiku (88-194 detik vs ~18 detik). Gratis tidak
  # berguna kalau bikin brief gagal terbit.
  # ------------------------------------------------------------------
  filter:     ["deepseek/deepseek-v3.2", "anthropic/claude-haiku-4.5"]
  classify:   ["deepseek/deepseek-v3.2", "anthropic/claude-haiku-4.5"]

  # Perapi pesan Telegram. Murni tata letak — tidak boleh menyentuh angka,
  # dan hasilnya diverifikasi kode sebelum dipakai. Model murah sudah cukup.
  format:     ["deepseek/deepseek-v3.2", "anthropic/claude-haiku-4.5"]

  # Mengusulkan kueri pencarian berita berdasarkan kondisi hari ini. Model
  # hanya menentukan ARAH pencarian; artikelnya diambil kode lewat Google
  # News RSS, jadi tidak ada peluang mengarang sumber. Tugas ringan.
  riset:      ["deepseek/deepseek-v3.2", "anthropic/claude-haiku-4.5"]

  # Mengambil postingan X (Twitter) lewat Grok. HARUS keluarga Grok: hanya
  # xAI yang punya akses pencarian langsung ke X. Model lain akan menjawab
  # dari ingatan — persis yang tidak kita inginkan.
  #
  # Verifikasi sesungguhnya ada di kode (src/collectors/x_grok.py), bukan
  # pada kepatuhan model: tiap item wajib punya URL status X berbentuk sah
  # dengan akun yang cocok dan waktu yang masuk akal, atau dibuang.
  #
  # grok-4 dipensiunkan xAI (OpenRouter membalas HTTP 404 dengan anjuran
  # pindah ke 4.3). Katalog model memang berubah cukup sering — kalau
  # langkah ini gagal 404 lagi, cek https://openrouter.ai/x-ai untuk slug
  # terbaru. Kegagalan di sini tidak menggagalkan brief: postingan X cuma
  # dilewati dan sumber pernyataan lain tetap jalan.
  x_posts:    ["x-ai/grok-4.3", "x-ai/grok-3"]

  # Ekstraksi teks kalender ekonomi investing.com jadi JSON. Tugasnya
  # sekadar "baca teks berantakan, temukan baris jadwal event" — tidak
  # perlu penalaran, model murah cukup. Sumber ini opsional (lihat
  # src/collectors/investing.py); gagal di sini tidak menggagalkan brief.
  agenda:     ["deepseek/deepseek-v3.2", "anthropic/claude-haiku-4.5"]

  # Ketiganya menghasilkan keterangan pendek per item (mekanisme berita,
  # jalur dampak agenda, penyaringan pernyataan tokoh) — bukan prosa utama
  # laporan. Sebelumnya memakai Haiku; dipindah ke DeepSeek karena ini juga
  # bagian dari penyiapan data, dan biayanya di sini paling terasa (langkah
  # statements saja bisa 4 panggilan per run).
  mechanism:  ["deepseek/deepseek-v3.2", "anthropic/claude-haiku-4.5"]
  agenda_dampak: ["deepseek/deepseek-v3.2", "anthropic/claude-haiku-4.5"]
  statements: ["deepseek/deepseek-v3.2", "anthropic/claude-haiku-4.5"]
  # Langkah `agen_kebijakan` DIHAPUS (tidak ada lagi entri di sini):
  # prosanya tidak pernah dirender setelah kebijakan AS pindah ke analisa AI,
  # sementara bagian yang benar-benar dipakai halaman — jendela jam bursa,
  # kerapuhan, risiko jendela, pendaratan sinyal — semuanya hitungan kode di
  # src/analysis/jendela_pasar.py dan tidak butuh model sama sekali.

  # Menafsirkan data dan menulis panjang: di sini kualitas model paling terasa.
  # GPT-5.1 utama, Sonnet 5 cadangan — GPT-5.1 sedikit lebih murah di kedua
  # sisi ($1,25/$10 per 1 juta token vs $3/$15 punya Sonnet 5, promo Sonnet
  # $2/$10 sampai 31 Agustus 2026), dan sekaligus membuat critic di bawah
  # otomatis beda keluarga dari synthesis tanpa pengaturan tambahan.
  technical:  ["openai/gpt-5.1", "anthropic/claude-sonnet-5"]
  whale:      ["openai/gpt-5.1", "anthropic/claude-sonnet-5"]
  synthesis:  ["openai/gpt-5.1", "anthropic/claude-sonnet-5"]
  outlook:    ["openai/gpt-5.1", "anthropic/claude-sonnet-5"]

  # PENTING: critic wajib beda keluarga dari synthesis. Synthesis sekarang
  # memakai OpenAI (GPT-5.1), jadi critic memakai Anthropic (Sonnet 5).
  # Model cenderung tidak menemukan kesalahannya sendiri — kalau keduanya
  # sekeluarga, critic jadi percuma.
  critic:     ["anthropic/claude-sonnet-5", "google/gemini-3.1-flash-lite-preview"]

  # UPAYA PENALARAN PER LANGKAH.
  #
  # KOREKSI atas catatan sebelumnya di baris ini. Sempat ditulis di sini
  # bahwa `effort` pada model Anthropic justru MENYALAKAN penalaran yang
  # tadinya mati, jadi tidak boleh dipasang. Itu keliru: pada Sonnet 5
  # penalaran ADAPTIF menyala secara bawaan — menghilangkan parameternya
  # bukan berarti mematikannya.
  #
  # Akibatnya terlihat di angka. Langkah `synthesis` menelan $0,156 per run,
  # padahal konteks masuknya cuma ~11.400 token (~$0,034 pada tarif Sonnet 5)
  # dan keluaran yang benar-benar mendarat di brief cuma ~1.350 token
  # (~$0,020). Selisihnya, sekitar $0,10 per run, adalah token yang ditagih
  # tapi tidak pernah muncul di halaman mana pun — tanda penalaran.
  #
  # `synthesis` dan `outlook` dipasang `medium`, bukan dimatikan: keduanya
  # MENAFSIRKAN angka yang sudah dihitung kode, jadi tidak butuh penalaran
  # sedalam bawaan, tapi juga bukan tugas mekanis. Kalau kualitas analisanya
  # terasa turun, naikkan lagi ke `high` — satu baris, dan efeknya terukur
  # di `token_per_langkah` pada telemetri.
  #
  # `technical` dan `whale` DITURUNKAN ke `low` (23 Agustus 2026). Alasannya
  # terukur, bukan tebakan: pada tarif GPT-5.1 ($1,25/$10 per 1 juta token)
  # biaya keduanya nyaris seluruhnya ada di sisi KELUARAN, dan sebagian besar
  # keluaran itu tidak pernah sampai ke pembaca. Rata-rata tiga run terakhir:
  #
  #   technical  masuk 2.013 tok ($0,0025) + keluar 3.129 tok ($0,0313)
  #   whale      masuk   872 tok ($0,0011) + keluar 1.155 tok ($0,0116)
  #
  # 93% biaya `technical` dan 91% biaya `whale` ada di keluaran — sementara
  # ringkasan yang benar-benar dirender halaman cuma ~150 dan ~186 token.
  # Sisanya token penalaran yang ditagih tanpa pernah terlihat.
  #
  # Keduanya adalah langkah yang paling tidak membutuhkan penalaran dalam di
  # seluruh pipeline: SEMUA angkanya — EMA, RSI, ATR, level kunci, rasio
  # posisi whale vs ritel — sudah dihitung kode di src/analysis/technical.py
  # dan src/collectors/whale.py. Yang diminta ke model cuma membaca angka
  # jadi lalu menuliskan tafsirnya dalam beberapa kalimat. Beda dengan
  # `synthesis`/`outlook` yang harus merangkai sebab-akibat lintas belasan
  # sumber sekaligus, dan karena itu tetap di `medium`.
  #
  # Kalau ringkasan teknikal/whale mulai terasa dangkal atau kehilangan
  # kaitan antar indikator, kembalikan ke `medium` — efeknya langsung
  # terlihat di `token_per_langkah.technical.keluar` pada telemetri.
  #
  # critic memakai Sonnet 5. Tugasnya memeriksa angka, bukan menulis esai,
  # jadi `low` memadai — dan itu sekaligus memperkecil peluang balasannya
  # terpotong, yang dulu membuatnya tidak pernah berhasil dijalankan.
  #
  # Bentuk parameter ini berbeda antar provider dan berubah seiring model
  # baru. Kalau ditolak, `llm.chat()` mengulang panggilannya tanpa parameter
  # itu dan mencatatnya di `effort_ditolak` — salah tebak paling banter
  # membuat langkahnya berjalan pada biaya penuh, bukan hilang.
  reasoning_effort:
    critic: low
    synthesis: medium
    outlook: medium
    technical: low
    whale: low

  # PLAFON PER RUN — diturunkan 0.75 -> 0.40 (23 Agustus 2026).
  #
  # Angka lama 0.75 berasal dari era sebelum langkah penyiapan data pindah ke
  # DeepSeek, saat rata-rata run memang $0,54. Setelah perpindahan itu, tiga
  # run terakhir rata-rata $0,243 — plafon 0.75 jadi tiga kali lipat biaya
  # sebenarnya, dan plafon yang tidak pernah tersentuh tidak menjaga apa pun.
  #
  # Sasaran yang dijaga sekarang adalah ANGGARAN BULANAN $10. Pada satu run
  # per hari itu $0,33/run rata-rata; 0.40 memberi ruang di atas rata-rata
  # tanpa membiarkan satu run buruk menelan jatah tiga hari.
  #
  # Perhitungan hari termahal yang masih muat, pada tarif sekarang:
  #
  #   run normal                                        $0,243
  #   + promo Sonnet 5 habis 31 Agt 2026 ($2/$10 -> $3/$15),
  #     critic 22.227 token masuk                       +$0,029
  #   + critic menahan narasi -> `revisi` menulis ulang +$0,070
  #                                                    --------
  #                                                     ~$0,342
  #
  # Sisa ruang ke 0.40 tinggal ~$0,06. Kalau critic dipanggil ULANG setelah
  # revisi (jalur di src/main.py yang memverifikasi hasil revisi), tambahan
  # ~$0,086 pasca-promo akan menembus plafon — pemeriksaan anggaran terjadi
  # SEBELUM panggilan, jadi yang terjadi bukan brief gagal melainkan langkah
  # sisanya (`format`) dilewati dan brief tetap terbit. Itu konsekuensi yang
  # diterima sadar: hari mahal berakhir dengan pesan Telegram yang tata
  # letaknya seadanya, bukan dengan tagihan yang jebol.
  #
  # Kalau `budget_terpakai_pct` di telemetri mulai sering menyentuh 100,
  # naikkan ke 0.45 — jangan menaikkannya diam-diam tanpa melihat angka itu.
  max_cost_usd_per_run: 0.40

news:
  # Dinaikkan seiring bertambahnya feed. Langkah filter relevansi yang
  # menyaring; menambah feed berarti menambah kandidat, bukan menambah
  # berita yang lolos ke brief (itu dibatasi max_after_filter).
  # Langkah filter sudah dibatch (60 artikel/panggilan), jadi menaikkan
  # angka ini tidak lagi berisiko membuat balasan model terpotong.
  max_fetch: 420
  # PEMANGKASAN SEBELUM LLM. Corong produksi 21 Agustus: 1.318 terkumpul ->
  # 413 segar -> 407 unik -> 25 dipakai. Keempat ratus artikel itu tetap
  # dikirim ke langkah filter dan ditagih token, padahal sebagian besar tidak
  # menyebut Bitcoin, kripto, bank sentral, maupun regulator sama sekali —
  # ikut tertarik karena feed makro (BBC World, NYTimes Business) memang
  # ditarik utuh.
  #
  # `prefilter_min_skor` membuang artikel yang skor kata kuncinya NOL, yaitu
  # yang tidak mencocoki satu pun pola di collectors/news.py. Sengaja tidak
  # lebih tinggi dari 1: menaikkannya mulai membuang kabar makro yang relevan
  # lewat jalur tak terduga, dan penilaian semacam itu memang tugas filter.
  # `maks_kandidat_llm` adalah pagar atas kalau suatu hari feednya membanjir.
  prefilter_min_skor: 1
  maks_kandidat_llm: 220
  # Tambahkan feed hasil riset LLM di samping daftar tetap di bawah.
  # Matikan (false) kalau ingin sumbernya benar-benar tetap.
  riset_dinamis: true
  max_after_filter: 25
  max_deep_analysis: 10
  max_age_hours: 36
  min_relevance: 40
  feeds:
    # --- Kripto: media ---
    - https://www.coindesk.com/arc/outboundfeeds/rss/
    - https://cointelegraph.com/rss
    - https://decrypt.co/feed
    - https://bitcoinmagazine.com/feed
    - https://www.theblock.co/rss.xml
    - https://blockworks.co/feed
    - https://cryptoslate.com/feed/
    - https://news.bitcoin.com/feed/
    - https://protos.com/feed/
    - https://www.dlnews.com/arc/outboundfeeds/rss/
    - https://cryptobriefing.com/feed/
    - https://beincrypto.com/feed/
    - https://ambcrypto.com/feed/
    # coinjournal.net DIPERTAHANKAN — sempat dicurigai gagal terus-menerus,
    # ternyata tidak. Diperiksa ulang 21 Agustus 2026 terhadap sembilan arsip
    # produksi: ia muncul sebagai "Feed gagal" HANYA pada run 17 Agustus
    # 18.28, dan delapan run setelahnya tidak punya satu pun feed gagal.
    # Membuangnya berarti kehilangan sumber yang bekerja karena satu
    # kegagalan sesaat. Kalau ia gagal lagi, sekarang terlihat berulang atau
    # tidaknya lewat telemetri per run (state/telemetri.jsonl).
    - https://coinjournal.net/feed/
    - https://bitcoinist.com/feed/
    - https://www.newsbtc.com/feed/
    - https://u.today/rss

    # --- Makro & geopolitik: media ---
    # Sebagian besar isinya tidak relevan bagi BTC dan memang akan dibuang
    # langkah filter; yang dicari adalah kebijakan bank sentral, sanksi,
    # dan guncangan global.
    - https://www.cnbc.com/id/20910258/device/rss/rss.html
    - https://feeds.bbci.co.uk/news/business/rss.xml
    - https://feeds.bbci.co.uk/news/world/rss.xml
    - https://www.aljazeera.com/xml/rss/all.xml
    - https://feeds.content.dowjones.io/public/rss/mw_topstories
    - https://rss.nytimes.com/services/xml/rss/nyt/Business.xml
    - https://feeds.bbci.co.uk/news/technology/rss.xml
    - https://www.cnbc.com/id/10000664/device/rss/rss.html
    - https://seekingalpha.com/market_currents.xml

    # --- Sumber PRIMER regulator & pemerintah AS ---
    # Ini yang paling menentukan akurasi analisa geopolitik/regulasi: bukan
    # laporan tentang kebijakan, tapi pengumuman kebijakannya sendiri.
    # Semuanya tier 1 dan bebas dari interpretasi pihak ketiga.
    - https://www.federalreserve.gov/feeds/press_all.xml
    - https://www.sec.gov/news/pressreleases.rss
    - https://www.cftc.gov/RSS/RSSGP/rssgp.xml
    - https://www.federalreserve.gov/feeds/speeches.xml
    - https://www.justice.gov/news/rss?type=press_release

    # --- Bank sentral & lembaga keuangan global ---
    # Keputusan di luar AS ikut menggerakkan likuiditas global, dan selama
    # ini brief cuma melihat sisi AS.
    #
    # DIHAPUS karena terbukti gagal di produksi (bukan dugaan — muncul di
    # `Feed gagal` pada run sungguhan): treasury.gov, fdic.gov, bis.org,
    # imf.org. Semuanya menolak permintaan dari IP pusat data atau tidak
    # menyajikan RSS yang bisa diparsing. Domainnya tetap terdaftar di
    # source_tiers karena artikel dari sana masih bisa masuk lewat Google
    # News, dan tier-nya tetap relevan untuk pembobotan.
    - https://www.ecb.europa.eu/rss/press.html

