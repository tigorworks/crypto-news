# Tanggal FOMC (UTC). Perbarui sekali setahun dari kalender resmi The Fed.
fomc_dates:
  - 2026-01-28
  - 2026-03-18
  - 2026-04-29
  - 2026-06-17
  - 2026-07-29
  - 2026-09-16
  - 2026-11-04
  - 2026-12-16

# Pelacakan pernyataan tokoh yang bisa menggerakkan pasar.
# Twitter/X tidak dipakai langsung: API gratisnya tidak lagi mengizinkan
# pembacaan timeline. Pernyataan di X tetap tertangkap lewat laporan media.
statements:
  # Postingan X lewat Grok. Matikan (aktif: false) kalau ingin brief ini
  # bersandar sepenuhnya pada sumber yang bisa diverifikasi kode — laporan
  # media dan feed resmi. Baca catatan panjang di src/collectors/x_grok.py
  # sebelum menyalakannya: verifikasi bentuk URL TIDAK membuktikan
  # postingannya ada, cuma membuktikan formatnya benar.
  x_grok:
    aktif: true
    akun:
      - realDonaldTrump
  max_age_hours: 48
  max_items: 25          # kandidat maksimum sebelum masuk LLM
  max_analyzed: 12       # pernyataan maksimum yang disimpan di brief
  min_relevance: 35
  truth_social_accounts:
    - realDonaldTrump
  official_feeds:
    - https://www.whitehouse.gov/presidential-actions/feed/
  google_news_queries:
    - Trump bitcoin
    - Trump cryptocurrency reserve
    - Trump Federal Reserve interest rates
    - Trump tariffs economy
    - Trump crypto regulation SEC

# Pengiriman Telegram.
telegram:
  # Ambil pelanggan yang mengirim /start ke bot. Butuh secret
  # TELEGRAM_SUBSCRIBER_KEY — tanpa itu fitur dimatikan supaya chat ID
  # tidak pernah tersimpan sebagai teks biasa di repo publik.
  aktifkan_pelanggan: true
  # Rapikan pesan lewat LLM murah sebelum dikirim. Hasilnya diverifikasi:
  # angka baru, tag HTML asing, atau penanda AI yang hilang membuat hasilnya
  # ditolak dan pesan asli yang dikirim.
  rapikan_dengan_llm: true
  # Jeda antar pesan saat broadcast. Telegram membatasi sekitar 30 pesan/detik.
  jeda_kirim_detik: 0.06
  # Username bot (tanpa @). Dipakai halaman web untuk tombol berlangganan.
  # Kosongkan kalau tombolnya tidak ingin ditampilkan.
  bot_username: tmmcrypto_bot

archive_retention_days: 90

# Link yang dipakai di pesan Telegram dan footer web.
site_url: https://tigorworks.github.io/crypto-news/
repo_url: https://github.com/tigorworks/crypto-news

# Tautan tambahan yang muncul sebagai tombol di kartu harga.
# `ikon` memakai nama ikon Lucide (https://lucide.dev/icons).
tautan_luar:
  - label: Arena Pertempuran BTC
    url: https://tigorworks.github.io/crypto-battlefield/
    ikon: swords
