# Konfigurasi Bitcoin Market Brief
# Semua nilai di sini aman untuk repo publik (tidak ada kredensial).

symbol: BTCUSDT

# Brief ini terbit sekali sehari, jadi analisanya bertumpu pada candle HARIAN.
# Timeframe 4H dan 1H sudah dibuang: pada laporan harian keduanya cuma menambah
# derau, dan pernah membuat pemeriksa fakta salah menuduh angka 1H sebagai
# karangan karena tertukar dengan angka 4H.
timeframes: [1d]

# Candle halus yang TIDAK ikut dianalisa/ditampilkan. Dipakai satu hal saja:
# mengukur reaksi harga satu jam setelah sebuah berita terbit.
timeframe_reaksi: 1h

candle_limit: 250

llm:
  base_url: https://openrouter.ai/api/v1
  # Setiap step memakai array agar OpenRouter otomatis fallback ke model berikutnya
  # kalau model pertama error / rate limit / kehabisan kapasitas.
  #
  # ISI SENDIRI setelah mengecek katalog https://openrouter.ai/models
  # Aturan praktis — PENGAMBILAN/PENYIAPAN DATA memakai Haiku (cadangan
  # DeepSeek), PENULISAN ANALISA memakai model kuat:
  #   filter    -> Haiku (tugasnya cuma memberi skor 0-100)
  #   classify  -> Haiku (JSON terstruktur per artikel)
  #   format    -> Haiku, cuma menata pesan Telegram
  #   agenda    -> Haiku, ekstraksi teks-ke-JSON dari investing.com
  #   riset     -> Haiku, mengusulkan kueri pencarian berita hari ini
  #   x_posts   -> GROK (wajib xAI: cuma Grok yang bisa mencari di X)
  #   agenda_dampak -> Haiku, menilai dampak agenda ke kripto
  #   mechanism -> Haiku, keterangan pendek per berita
  #   statements-> Haiku (menyaring pernyataan tokoh dari derau berita)
  #   technical -> model menengah/kuat (MENAFSIRKAN indikator, bukan menghitung)
  #   whale     -> model menengah/kuat (membaca posisi whale vs ritel)
  #   synthesis -> model kuat (menulis analisa panjang bersebab-akibat)
  #   outlook   -> model kuat (pandangan ke depan: teknikal+makro+geopolitik)
  #   critic    -> model kuat dari KELUARGA BERBEDA dengan synthesis,
  #                supaya bias model tidak saling menutupi
  #
  # Cek ulang daftar ini secara berkala:  python -m scripts.list_models
  # Katalog OpenRouter berubah cukup sering; model bisa pensiun atau berganti
  # slug. Model yang tidak dikenali akan otomatis jatuh ke cadangan di
  # sebelahnya, dan kalau dua-duanya gagal step-nya dilewati tanpa
  # menggagalkan brief.

  # ------------------------------------------------------------------
  # LANGKAH PENGAMBILAN & PENYIAPAN DATA — HAIKU, cadangan DeepSeek.
  # Semua langkah di blok ini cuma mengubah data jadi data: memberi skor,
  # mengklasifikasi, mengekstrak jadwal, mengusulkan kueri pencarian.
  # Tidak ada satupun yang menulis prosa yang dibaca pengguna.
  #
  # Sempat dipindah ke DeepSeek demi hemat, lalu dikembalikan ke Haiku
  # karena kepatuhan formatnya lebih bisa diandalkan — DeepSeek pernah
  # menulis skala 1-5 sebagai angka Romawi ("kekuatan": III) dan
  # menggugurkan satu batch pernyataan utuh. DeepSeek tetap dipasang
  # sebagai cadangan supaya satu vendor bermasalah tidak mematikan langkah.
  # ------------------------------------------------------------------
  filter:     ["anthropic/claude-haiku-4.5", "deepseek/deepseek-v3.2"]
  classify:   ["anthropic/claude-haiku-4.5", "deepseek/deepseek-v3.2"]

  # Perapi pesan Telegram. Murni tata letak — tidak boleh menyentuh angka,
  # dan hasilnya diverifikasi kode sebelum dipakai. Model murah sudah cukup.
  format:     ["anthropic/claude-haiku-4.5", "deepseek/deepseek-v3.2"]

  # Mengusulkan kueri pencarian berita berdasarkan kondisi hari ini. Model
  # hanya menentukan ARAH pencarian; artikelnya diambil kode lewat Google
  # News RSS, jadi tidak ada peluang mengarang sumber. Tugas ringan.
  riset:      ["anthropic/claude-haiku-4.5", "deepseek/deepseek-v3.2"]

  # Mengambil postingan X (Twitter) lewat Grok. HARUS keluarga Grok: hanya
  # xAI yang punya akses pencarian langsung ke X. Model lain akan menjawab
  # dari ingatan — persis yang tidak kita inginkan.
  #
  # Verifikasi sesungguhnya ada di kode (src/collectors/x_grok.py), bukan
  # pada kepatuhan model: tiap item wajib punya URL status X berbentuk sah
  # dengan akun yang cocok dan waktu yang masuk akal, atau dibuang.
  #
  # grok-4 dipensiunkan xAI (OpenRouter membalas HTTP 404 dengan anjuran
  # pindah ke 4.3). Katalog model memang berubah cukup sering — kalau
  # langkah ini gagal 404 lagi, cek https://openrouter.ai/x-ai untuk slug
  # terbaru. Kegagalan di sini tidak menggagalkan brief: postingan X cuma
  # dilewati dan sumber pernyataan lain tetap jalan.
  x_posts:    ["x-ai/grok-4.3", "x-ai/grok-3"]

  # Ekstraksi teks kalender ekonomi investing.com jadi JSON. Tugasnya
  # sekadar "baca teks berantakan, temukan baris jadwal event" — tidak
  # perlu penalaran, model murah cukup. Sumber ini opsional (lihat
  # src/collectors/investing.py); gagal di sini tidak menggagalkan brief.
  agenda:     ["anthropic/claude-haiku-4.5", "deepseek/deepseek-v3.2"]

  # Ketiganya menghasilkan keterangan pendek per item (mekanisme berita,
  # jalur dampak agenda, penyaringan pernyataan tokoh) — bukan prosa utama
  # laporan. Sebelumnya memakai Haiku; dipindah ke DeepSeek karena ini juga
  # bagian dari penyiapan data, dan biayanya di sini paling terasa (langkah
  # statements saja bisa 4 panggilan per run).
  mechanism:  ["anthropic/claude-haiku-4.5", "deepseek/deepseek-v3.2"]
  agenda_dampak: ["anthropic/claude-haiku-4.5", "deepseek/deepseek-v3.2"]
  statements: ["anthropic/claude-haiku-4.5", "deepseek/deepseek-v3.2"]

  # Menafsirkan data dan menulis panjang: di sini kualitas model paling terasa.
  technical:  ["anthropic/claude-sonnet-5", "openai/gpt-5.1"]
  whale:      ["anthropic/claude-sonnet-5", "openai/gpt-5.1"]
  synthesis:  ["anthropic/claude-sonnet-5", "openai/gpt-5.1"]
  outlook:    ["anthropic/claude-sonnet-5", "openai/gpt-5.1"]

  # PENTING: critic wajib beda keluarga dari synthesis. Synthesis memakai
  # Anthropic, jadi critic memakai OpenAI. Model cenderung tidak menemukan
  # kesalahannya sendiri — kalau keduanya sekeluarga, critic jadi percuma.
  critic:     ["openai/gpt-5.1", "google/gemini-3.1-flash-lite-preview"]

  # Dengan Sonnet, run terukur di produksi ~$0,26. Plafon 0.60 memberi ruang
  # untuk satu putaran revisi kalau critic menemukan masalah — tanpa ruang
  # itu, revisi akan terpotong budget dan analisa jadi hilang sama sekali.
  max_cost_usd_per_run: 0.60

news:
  # Dinaikkan seiring bertambahnya feed. Langkah filter relevansi yang
  # menyaring; menambah feed berarti menambah kandidat, bukan menambah
  # berita yang lolos ke brief (itu dibatasi max_after_filter).
  # Langkah filter sudah dibatch (60 artikel/panggilan), jadi menaikkan
  # angka ini tidak lagi berisiko membuat balasan model terpotong.
  max_fetch: 420
  # Tambahkan feed hasil riset LLM di samping daftar tetap di bawah.
  # Matikan (false) kalau ingin sumbernya benar-benar tetap.
  riset_dinamis: true
  max_after_filter: 25
  max_deep_analysis: 10
  max_age_hours: 36
  min_relevance: 40
  feeds:
    # --- Kripto: media ---
    - https://www.coindesk.com/arc/outboundfeeds/rss/
    - https://cointelegraph.com/rss
    - https://decrypt.co/feed
    - https://bitcoinmagazine.com/feed
    - https://www.theblock.co/rss.xml
    - https://blockworks.co/feed
    - https://cryptoslate.com/feed/
    - https://news.bitcoin.com/feed/
    - https://protos.com/feed/
    - https://www.dlnews.com/arc/outboundfeeds/rss/
    - https://cryptobriefing.com/feed/
    - https://beincrypto.com/feed/
    - https://ambcrypto.com/feed/
    - https://coinjournal.net/feed/
    - https://bitcoinist.com/feed/
    - https://www.newsbtc.com/feed/
    - https://u.today/rss

    # --- Makro & geopolitik: media ---
    # Sebagian besar isinya tidak relevan bagi BTC dan memang akan dibuang
    # langkah filter; yang dicari adalah kebijakan bank sentral, sanksi,
    # dan guncangan global.
    - https://www.cnbc.com/id/20910258/device/rss/rss.html
    - https://feeds.bbci.co.uk/news/business/rss.xml
    - https://feeds.bbci.co.uk/news/world/rss.xml
    - https://www.aljazeera.com/xml/rss/all.xml
    - https://feeds.content.dowjones.io/public/rss/mw_topstories
    - https://rss.nytimes.com/services/xml/rss/nyt/Business.xml
    - https://feeds.bbci.co.uk/news/technology/rss.xml
    - https://www.cnbc.com/id/10000664/device/rss/rss.html
    - https://seekingalpha.com/market_currents.xml

    # --- Sumber PRIMER regulator & pemerintah AS ---
    # Ini yang paling menentukan akurasi analisa geopolitik/regulasi: bukan
    # laporan tentang kebijakan, tapi pengumuman kebijakannya sendiri.
    # Semuanya tier 1 dan bebas dari interpretasi pihak ketiga.
    - https://www.federalreserve.gov/feeds/press_all.xml
    - https://www.sec.gov/news/pressreleases.rss
    - https://www.cftc.gov/RSS/RSSGP/rssgp.xml
    - https://www.federalreserve.gov/feeds/speeches.xml
    - https://www.justice.gov/news/rss?type=press_release

    # --- Bank sentral & lembaga keuangan global ---
    # Keputusan di luar AS ikut menggerakkan likuiditas global, dan selama
    # ini brief cuma melihat sisi AS.
    #
    # DIHAPUS karena terbukti gagal di produksi (bukan dugaan — muncul di
    # `Feed gagal` pada run sungguhan): treasury.gov, fdic.gov, bis.org,
    # imf.org. Semuanya menolak permintaan dari IP pusat data atau tidak
    # menyajikan RSS yang bisa diparsing. Domainnya tetap terdaftar di
    # source_tiers karena artikel dari sana masih bisa masuk lewat Google
    # News, dan tier-nya tetap relevan untuk pembobotan.
    - https://www.ecb.europa.eu/rss/press.html

# Tier kredibilitas sumber untuk pembobotan skor sentimen.
# tier 1 = 1.0, tier 2 = 0.7, tier 3 = 0.4 (default tier 3 kalau tidak terdaftar)
source_tiers:
  # Sumber primer pemerintah/regulator: bukan laporan tentang kebijakan,
  # melainkan kebijakannya sendiri. Tidak ada yang lebih tepercaya dari ini.
  federalreserve.gov: 1
  sec.gov: 1
  cftc.gov: 1
  treasury.gov: 1
  whitehouse.gov: 1
  justice.gov: 1
  fdic.gov: 1
  ecb.europa.eu: 1
  bis.org: 1
  imf.org: 1
  reuters.com: 1
  bloomberg.com: 1
  wsj.com: 1
  ft.com: 1
  apnews.com: 1
  cnbc.com: 1
  bbc.co.uk: 1
  bbc.com: 1
  aljazeera.com: 1
  nytimes.com: 1
  marketwatch.com: 2
  coindesk.com: 2
  theblock.co: 2
  blockworks.co: 2
  cointelegraph.com: 2
  decrypt.co: 2
  dlnews.com: 2
  seekingalpha.com: 3
