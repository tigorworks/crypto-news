# Konfigurasi Bitcoin Market Brief
# Semua nilai di sini aman untuk repo publik (tidak ada kredensial).

symbol: BTCUSDT
timeframes: [1d, 4h, 1h]
candle_limit: 250

llm:
  base_url: https://openrouter.ai/api/v1
  # Setiap step memakai array agar OpenRouter otomatis fallback ke model berikutnya
  # kalau model pertama error / rate limit / kehabisan kapasitas.
  #
  # ISI SENDIRI setelah mengecek katalog https://openrouter.ai/models
  # Aturan praktis:
  #   filter    -> model paling murah (tugasnya cuma memberi skor 0-100)
  #   classify  -> model kecil tapi patuh JSON
  #   mechanism -> model menengah (butuh penalaran sebab-akibat)
  #   statements-> model menengah (menyaring pernyataan tokoh dari derau berita)
  #   technical -> model menengah/kuat (MENAFSIRKAN indikator, bukan menghitung)
  #   whale     -> model menengah/kuat (membaca posisi whale vs ritel)
  #   synthesis -> model kuat (menulis analisa panjang bersebab-akibat)
  #   outlook   -> model kuat (pandangan ke depan: teknikal+makro+geopolitik)
  #   critic    -> model kuat dari KELUARGA BERBEDA dengan synthesis,
  #                supaya bias model tidak saling menutupi
  #
  # Cek ulang daftar ini secara berkala:  python -m scripts.list_models
  # Katalog OpenRouter berubah cukup sering; model bisa pensiun atau berganti
  # slug. Model yang tidak dikenali akan otomatis jatuh ke cadangan di
  # sebelahnya, dan kalau dua-duanya gagal step-nya dilewati tanpa
  # menggagalkan brief.

  # Tugas murah dan berulang: skor 0-100 dan klasifikasi terstruktur.
  filter:     ["deepseek/deepseek-v3.2", "anthropic/claude-haiku-4.5"]
  classify:   ["deepseek/deepseek-v3.2", "anthropic/claude-haiku-4.5"]

  # Butuh penalaran sebab-akibat, tapi keluarannya pendek.
  mechanism:  ["anthropic/claude-haiku-4.5", "deepseek/deepseek-v3.2"]
  statements: ["anthropic/claude-haiku-4.5", "deepseek/deepseek-v3.2"]

  # Menafsirkan data dan menulis panjang. DeepSeek dipilih karena jauh lebih
  # murah dari model kelas atas dengan keluaran yang masih memadai; cadangan
  # sengaja Haiku, BUKAN OpenAI, supaya tetap beda keluarga dari critic
  # walaupun sedang jatuh ke cadangan.
  technical:  ["deepseek/deepseek-v3.2", "anthropic/claude-haiku-4.5"]
  whale:      ["deepseek/deepseek-v3.2", "anthropic/claude-haiku-4.5"]
  synthesis:  ["deepseek/deepseek-v3.2", "anthropic/claude-haiku-4.5"]
  outlook:    ["deepseek/deepseek-v3.2", "anthropic/claude-haiku-4.5"]

  # PENTING: critic wajib beda keluarga dari synthesis. Synthesis memakai
  # DeepSeek, jadi critic memakai OpenAI. Model cenderung tidak menemukan
  # kesalahannya sendiri — kalau keduanya sekeluarga, critic jadi percuma.
  critic:     ["openai/gpt-5.1", "google/gemini-3.1-flash-lite-preview"]

  # Setelah step naratif pindah ke DeepSeek, satu run diperkirakan ~$0,08-0,12.
  # Plafon disetel 0.25 — masih dua kali lipat perkiraan, tapi cukup ketat
  # untuk menangkap kalau ada yang boros di luar dugaan.
  max_cost_usd_per_run: 0.25

news:
  # Dinaikkan dari 120 karena feed makro/geopolitik ikut masuk.
  max_fetch: 160
  max_after_filter: 25
  max_deep_analysis: 10
  max_age_hours: 36
  min_relevance: 40
  feeds:
    # Kripto
    - https://www.coindesk.com/arc/outboundfeeds/rss/
    - https://cointelegraph.com/rss
    - https://decrypt.co/feed
    - https://bitcoinmagazine.com/feed
    - https://www.theblock.co/rss.xml
    # Makro & geopolitik — dibutuhkan analisa outlook. Sebagian besar isinya
    # tidak relevan bagi BTC dan memang akan dibuang oleh langkah filter;
    # yang dicari adalah kebijakan bank sentral, sanksi, dan guncangan global.
    - https://www.cnbc.com/id/20910258/device/rss/rss.html
    - https://feeds.bbci.co.uk/news/business/rss.xml
    - https://feeds.bbci.co.uk/news/world/rss.xml

# Tier kredibilitas sumber untuk pembobotan skor sentimen.
# tier 1 = 1.0, tier 2 = 0.7, tier 3 = 0.4 (default tier 3 kalau tidak terdaftar)
source_tiers:
  reuters.com: 1
  bloomberg.com: 1
  wsj.com: 1
  ft.com: 1
  apnews.com: 1
  cnbc.com: 1
  bbc.co.uk: 1
  bbc.com: 1
  coindesk.com: 2
  theblock.co: 2
  cointelegraph.com: 2
  decrypt.co: 2
  bitcoinmagazine.com: 3

# Tanggal FOMC (UTC). Perbarui sekali setahun dari kalender resmi The Fed.
fomc_dates:
  - 2026-01-28
  - 2026-03-18
  - 2026-04-29
  - 2026-06-17
  - 2026-07-29
  - 2026-09-16
  - 2026-11-04
  - 2026-12-16

# Pelacakan pernyataan tokoh yang bisa menggerakkan pasar.
# Twitter/X tidak dipakai langsung: API gratisnya tidak lagi mengizinkan
# pembacaan timeline. Pernyataan di X tetap tertangkap lewat laporan media.
statements:
  max_age_hours: 48
  max_items: 25          # kandidat maksimum sebelum masuk LLM
  max_analyzed: 12       # pernyataan maksimum yang disimpan di brief
  min_relevance: 35
  truth_social_accounts:
    - realDonaldTrump
  official_feeds:
    - https://www.whitehouse.gov/presidential-actions/feed/
  google_news_queries:
    - Trump bitcoin
    - Trump cryptocurrency reserve
    - Trump Federal Reserve interest rates
    - Trump tariffs economy
    - Trump crypto regulation SEC

# Pengiriman Telegram.
telegram:
  # Ambil pelanggan yang mengirim /start ke bot. Butuh secret
  # TELEGRAM_SUBSCRIBER_KEY — tanpa itu fitur dimatikan supaya chat ID
  # tidak pernah tersimpan sebagai teks biasa di repo publik.
  aktifkan_pelanggan: true
  # Jeda antar pesan saat broadcast. Telegram membatasi sekitar 30 pesan/detik.
  jeda_kirim_detik: 0.06

archive_retention_days: 90

# Link yang dipakai di pesan Telegram dan footer web.
site_url: https://tigorworks.github.io/crypto-news/
repo_url: https://github.com/tigorworks/crypto-news
